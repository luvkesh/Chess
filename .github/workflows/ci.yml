name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-prototype:
    name: Web prototype (engine tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine tests
        run: node test/engine.test.js
      - name: Build single-file game
        run: python3 build.py
      - name: Check committed build is up to date
        run: git diff --exit-code -- dist/chacklate-chess.html
      - uses: actions/upload-artifact@v4
        with:
          name: chacklate-chess-html
          path: apps/web-prototype/dist/chacklate-chess.html
