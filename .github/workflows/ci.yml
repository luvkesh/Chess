name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: Engine, coach and content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node packages/chess-core/test/engine.test.js
      - name: Coach tests
        run: node packages/chess-core/test/coach.test.js
      - name: Content tests (lessons, puzzles, catalog)
        run: node packages/content/test/content.test.js

  web:
    name: Web game (progress tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Progress tests
        run: node apps/web-prototype/test/progress.test.js
      - name: Build single-file game
        run: python3 apps/web-prototype/build.py
      - name: Check committed build is up to date
        run: git diff --exit-code -- apps/web-prototype/dist/chacklate-chess.html
      - uses: actions/upload-artifact@v4
        with:
          name: chacklate-chess-html
          path: apps/web-prototype/dist/chacklate-chess.html

  server:
    name: Game server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/game-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests
        run: node --test test/*.test.js
