name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packages:
    name: Engine, coach and content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node packages/chess-core/test/engine.test.js
      - name: Coach tests
        run: node packages/chess-core/test/coach.test.js
      - name: Content tests (lessons, puzzles, catalog)
        run: node packages/content/test/content.test.js

  web:
    name: Web game (progress, voice, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Progress tests
        run: node apps/web-prototype/test/progress.test.js
      - name: Voice script and clips
        run: node apps/web-prototype/test/voice.test.js
      - name: Audio guide lines and clips
        run: node apps/web-prototype/test/guide.test.js
      - name: Rooky's Collection pitches and clips
        run: node apps/web-prototype/test/pitch.test.js
      - name: Every tooltip has its text
        run: node apps/web-prototype/test/tips.test.js
      - name: Catalog looks exist in the 3D code
        run: node apps/web-prototype/test/looks.test.js
      - name: Club places, leagues and location rules
        run: node apps/web-prototype/test/club.test.js
      - name: Mini-games can be won
        run: node apps/web-prototype/test/minigames.test.js
      - name: Rule book follows the position
        run: node apps/web-prototype/test/rules.test.js
      - name: Build single-file game
        run: python3 apps/web-prototype/build.py
      - name: Check committed build is up to date
        run: git diff --exit-code -- apps/web-prototype/dist/chackmate.html
      - name: Build website
        run: python3 apps/website/build.py
      - name: Check committed website is up to date
        run: git diff --exit-code -- apps/website/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: chackmate-html
          path: apps/web-prototype/dist/chackmate.html

  server:
    name: Game server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/game-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests
        run: node --test test/*.test.js

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t chacklate:ci --build-arg VERSION=${{ github.sha }} .
      - name: Run and check health, pages and backups
        run: |
          docker run -d --name app -p 8080:8080 chacklate:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/api/health | grep '"ok":true'
          for p in / /play /admin /parent /privacy /terms /voice/index.json /sw.js /manifest.webmanifest /icons/icon-512.png; do curl -sf -o /dev/null "localhost:8080$p" || { echo "missing $p"; exit 1; }; done
          docker exec app node src/cli.js backup /data/backups
          docker exec app sh -c 'ls /data/backups/chacklate-*.db'
      - name: Server log
        if: always()
        run: docker logs app || true

  unity-core:
    name: Unity core (C# rules port + online client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Reference games from the JS rules
        run: node apps/unity/Tests/fixtures.js > apps/unity/Tests/Chacklate.Core.Tests/fixtures.json
      - name: Start the game server
        run: |
          (cd services/game-server && CHACKLATE_DB=/tmp/ci.db node src/server.js > /tmp/server.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
      - name: C# tests, including a live game against the server
        working-directory: apps/unity/Tests/Chacklate.Core.Tests
        env:
          CHACKLATE_SERVER: ws://127.0.0.1:8080/ws
        run: dotnet run -c Release
      - name: Server log
        if: always()
        run: cat /tmp/server.log || true
