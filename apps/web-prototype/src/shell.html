.peekbar { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 24px); bottom: calc(var(--safe-b) + 24px); z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 22px; border-radius: 999px; animation: rise .5s var(--ease) both; }
.peekbar small { display: block; font: 600 10px/1.2 var(--caps); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
.peekbar b { font: 500 21px/1.15 var(--serif); }
/* the free camera after a game: the HUD steps aside, a bar at the bottom leads back to the seat */
body.exploring #screens, body.exploring .tabbar, body.exploring .guide { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .35s var(--ease), visibility 0s linear .35s; }
body.exploring #screens * { pointer-events: none !important; }
body.exploring #stage canvas { touch-action: none; }
body.exploring .shade { background: radial-gradient(ellipse 95% 85% at 50% 50%, transparent 62%, rgba(6, 3, 2, 0.5) 100%); }
body.exploring.lowfx .shade, body.exploring.lowfx .grain { display: none; }   /* low quality: nothing drawn over the moving view */
.explore kbd { display: inline-block; min-width: 1.7em; padding: 1px 5px; margin: 0 2px; border: 1px solid rgba(232, 194, 122, 0.5); border-radius: 5px; font: 600 11px/1.5 var(--body); text-align: center; color: var(--gold); background: rgba(0, 0, 0, 0.25); }
.explorebar { position: fixed; left: 0; right: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 24px); bottom: calc(var(--safe-b) + 24px); z-index: 30; display: flex; align-items: center; gap: 14px; padding: 10px 10px 10px 22px; border-radius: 999px; animation: rise .5s var(--ease) both; }
.explorebar small, .explorehint small { display: block; font: 600 10px/1.2 var(--caps); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
.explorebar b { font: 500 21px/1.15 var(--serif); }
.explorehint { position: fixed; left: 0; right: 0; margin: 0 auto; top: calc(var(--safe-t) + 18px); z-index: 30; width: min(340px, calc(100% - 32px)); padding: 16px 18px 14px; border-radius: 18px; animation: rise .5s var(--ease) both; }
.explorehint ul { list-style: none; margin: 8px 0 12px; padding: 0; display: grid; gap: 6px; font-size: 14px; line-height: 1.45; }
.explorehint li::before { content: "\25C6"; color: var(--gold); font-size: 8px; margin-right: 8px; vertical-align: 2px; }
body.lowfx .explorebar, body.lowfx .explorehint { animation: none; }
@media (max-width: 520px) { .explorebar { padding-left: 16px; gap: 10px; } .explorebar b { font-size: 17px; } }
/* capture scenes: a quiet pill under the top bar; a tap anywhere on the table skips too */
.cine-skip { position: fixed; left: 50%; top: calc(var(--safe-t) + 78px); z-index: 30; transform: translate(-50%, -6px); opacity: 0; pointer-events: none; padding: 8px 16px; border-radius: 999px; background: rgba(14, 9, 6, 0.72); border: 1px solid var(--line-2); color: var(--gold-2); font: 600 10.5px/1 var(--caps); letter-spacing: 0.2em; text-transform: uppercase; transition: opacity .35s var(--ease), transform .35s var(--ease); }
.cine-skip.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
/* "Surprise me": the opponent's two paws, one white pawn and one black. No backdrop blur: the
   table keeps drawing behind it. */
.toss { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; padding: calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px); pointer-events: auto;
  background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(14, 8, 5, 0.78), rgba(8, 4, 2, 0.55)); animation: rise .4s var(--ease) both; transition: opacity .3s var(--ease); }
.toss.out { opacity: 0; pointer-events: none; }
.toss-in { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; max-width: 460px; }
.toss-in h2 { margin: 2px 0 0; font: 600 clamp(26px, 6vw, 36px)/1.1 var(--display); color: var(--gold-2); }
.toss-in .sub { margin: 0 0 6px; color: var(--muted); }
.toss-face { width: 84px; height: 84px; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.6)); margin-bottom: 4px; }
.toss-hands { display: flex; gap: clamp(18px, 8vw, 56px); margin: 6px 0 12px; }
.toss-hand { position: relative; width: clamp(118px, 34vw, 150px); aspect-ratio: 1 / 1.15; padding: 0; border: 0; background: none; border-radius: 26px; cursor: pointer; animation: toss-bob 1.6s ease-in-out infinite; }
.toss-hand.right { animation-delay: -.8s; }
.toss-hand.right .paw { transform: scaleX(-1); }
.toss-hand:hover .paw.closed, .toss-hand:focus-visible .paw.closed { filter: drop-shadow(0 0 16px rgba(246, 220, 156, 0.55)); }
.toss-hand:active .paw.closed { transform: scale(0.95); }
.toss-hand.right:active .paw.closed { transform: scaleX(-1) scale(0.95); }
.toss-hand:disabled { cursor: default; animation: none; }
.toss .paw { position: absolute; inset: auto 0 0; display: block; transition: opacity .3s var(--ease), transform .35s var(--ease); }
.toss .paw svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.55)); }
.toss .paw .fill { fill: var(--paw); stroke: var(--paw-2); stroke-width: 3; }
.toss .paw .cuff { fill: var(--paw-2); }
.toss .paw .line { fill: none; stroke: var(--paw-2); stroke-width: 3.5; stroke-linecap: round; opacity: 0.8; }
.toss .paw .shine { fill: #fff; opacity: 0.18; }
.toss .paw .pad { fill: #f2b8c2; opacity: 0.9; }
.toss .paw.open { opacity: 0; transform: translateY(8px) scale(0.92); }
.toss .opened .paw.closed, .toss.opened .paw.closed { opacity: 0; transform: translateY(6px) scale(1.06); }
.toss.opened .paw.open { opacity: 1; transform: none; }
.toss.opened .toss-hand.right .paw.open { transform: scaleX(-1); }
.toss-slot { position: absolute; left: 50%; bottom: 30%; width: 58%; transform: translateX(-50%); }
.toss-slot img { display: block; width: 100%; height: auto; opacity: 0; transform: translateY(30%) scale(0.7); filter: drop-shadow(0 10px 14px rgba(0, 0, 0, 0.6)); }
.toss.opened .toss-slot img { opacity: 1; transform: none; transition: opacity .3s .12s var(--ease), transform .5s .12s var(--ease); }
.toss-slot img:not(.in) { border-radius: 50%; width: 76%; margin: 0 auto; }
.toss-hand.yours .toss-slot img { filter: drop-shadow(0 0 18px rgba(246, 220, 156, 0.8)) drop-shadow(0 10px 14px rgba(0, 0, 0, 0.6)); }
.toss-hand.theirs { opacity: 0.6; transition: opacity .4s .5s; }
.toss-stash { display: none; }
.toss.still .toss-hand, .toss.still { animation: none; }
.toss.still .paw, .toss.still .toss-slot img { transition: none; }
@keyframes toss-bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
body.tossing #screens .player-card, body.tossing #screens .actionbar, body.tossing #screens .side, body.tossing #screens .status-chip, body.tossing #guide { visibility: hidden; }
.toss.opened #toss-skip { visibility: hidden; }

/* ------------------------------------------------------------ the game HUD */
/* The table fills the screen. A column on the right holds the opponent, the moves and the
   coach, then you; the action bar sits under the board. */
:root { --col: 360px; }
.hud-top { position: absolute; top: calc(var(--safe-t) + 14px); left: max(16px, var(--safe-l)); right: max(16px, var(--safe-r)); display: flex; align-items: center; gap: 10px; z-index: 7; pointer-events: none; }
.hud-top > * { pointer-events: auto; }
.hud-top .spacer { flex: 1; pointer-events: none; }
.hud-top .round { background: rgba(14, 9, 6, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.hud-top .title { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 40vw; height: 42px; padding: 0 16px 0 5px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(14, 9, 6, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font: 600 11.5px/1 var(--caps); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-2); }
.hud-top .title img { width: 32px; height: 32px; }
.hud-top .title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud-top .pill { height: 42px; padding: 0 14px; font-size: 13px; color: var(--ink); }
.hud-top .pill b { color: var(--gold-2); font-weight: 600; } .hud-top .pill .up { color: var(--ok); } .hud-top .pill .down { color: var(--danger); }
.backbtn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 16px 0 12px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(14, 9, 6, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font: 600 11.5px/1 var(--caps); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-2); transition: border-color .25s, box-shadow .25s; flex: none; }
.backbtn:hover { border-color: var(--gold); box-shadow: 0 0 18px rgba(232, 194, 122, 0.2); }
.status-chip { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 18px; border-radius: 999px; font: 600 11.5px/1 var(--caps); letter-spacing: 0.16em; text-transform: uppercase; white-space: nowrap; color: var(--gold-2); flex: none; }
.status-chip.thinking::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1s ease-in-out infinite; }
.status-chip.check { border-color: rgba(255, 90, 80, 0.65); color: #ffd6d1; box-shadow: var(--shadow), 0 0 26px rgba(255, 90, 80, 0.3); }
@keyframes pulse { 50% { opacity: 0.25; transform: scale(0.8); } }
.player-card { position: absolute; right: max(16px, var(--safe-r)); width: var(--col); height: 82px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 8px; border-radius: 999px 22px 22px 999px; z-index: 6; transition: border-color .35s, box-shadow .35s; }
.player-card.top { top: calc(var(--safe-t) + 70px); }
.player-card.bottom { bottom: calc(var(--safe-b) + 16px); }
.player-card.to-move { border-color: rgba(232, 194, 122, 0.7); box-shadow: var(--shadow), var(--glow); }
.player-card .pp { width: 54px; height: 54px; flex: none; position: relative; }
.player-card .pp > img { width: 100%; height: 100%; border-radius: 50%; }
.player-card .pp .avatar { width: 54px; height: 54px; }
.player-card.to-move .pp::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--gold); animation: turnring 1.8s ease-in-out infinite; }
@keyframes turnring { 50% { transform: scale(1.06); opacity: 0.4; } }
.player-card .who { flex: 1; min-width: 0; }
.player-card .name { font: 500 21px/1.05 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.player-card .sub { font: 600 9.5px/1.2 var(--caps); letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
.player-card .taken { display: flex; align-items: center; min-height: 18px; margin-top: 3px; }
.player-card .caps { display: flex; }
.player-card .caps img { width: 17px; height: 17px; margin-right: -5px; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.6)); }
.player-card .adv { font: 600 11px/1 var(--mono); color: var(--ok); margin-left: 9px; }
.clock { font: 600 22px/1 var(--mono); font-variant-numeric: tabular-nums; padding: 10px 12px; border-radius: 14px; min-width: 4.3em; text-align: center; background: rgba(6, 3, 2, 0.7); color: var(--muted); border: 1px solid var(--line); flex: none; }
.clock.running { color: #2a1606; background: linear-gradient(180deg, #fbe6ad, #d9a54e); border-color: #fbe7b4; box-shadow: 0 0 22px rgba(232, 194, 122, 0.45); }
.clock.low { color: #fff; background: linear-gradient(180deg, #ff8a7e, #d93c3c); border-color: #ffb0a6; animation: lowpulse 1s ease-in-out infinite; }
@keyframes lowpulse { 50% { box-shadow: 0 0 26px rgba(255, 90, 80, 0.55); } }
.clock.skin-amber.running { background: linear-gradient(180deg, #ffcf8a, #f09a3a); border-color: #ffcf8a; color: #2a1406; }
.clock.skin-ruby.running { background: linear-gradient(180deg, #ff9ab4, #c43a63); border-color: #ff9ab4; color: #fff; }
.clock.skin-gold.running { background: linear-gradient(180deg, #fff1cf, #e3b25a); border-color: #fff1cf; color: #2a1a0a; }
.clock.skin-ice.running { background: linear-gradient(180deg, #e6f8ff, #8fd3ff); border-color: #e6f8ff; color: #06121a; }
.side { position: absolute; top: calc(var(--safe-t) + 164px); right: max(16px, var(--safe-r)); bottom: calc(var(--safe-b) + 110px); width: var(--col); display: flex; flex-direction: column; overflow: hidden; z-index: 6; }
.side.wide { top: calc(var(--safe-t) + 70px); bottom: calc(var(--safe-b) + 16px); width: calc(var(--col) + 20px); }
.side header { display: flex; align-items: center; gap: 8px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
.side header b { font: 600 12px/1 var(--caps); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-2); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.round.rb { padding: 0; overflow: hidden; border-color: rgba(232, 194, 122, 0.55); background: transparent; }
.round.rb img { width: 100%; height: 100%; display: block; transition: transform .3s var(--ease); }
.round.rb:hover img, .round.rb.on img { transform: scale(1.08) rotate(-4deg); }
.round.rb.on { box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(232, 194, 122, 0.45); }
.rulebook { z-index: 8; animation: rise .35s var(--ease) both; }
.rulebook header .rb-ico { width: 30px; height: 30px; margin: -6px 0; }
.rulebook header .x { margin: -6px -6px -6px 0; }
.rb-body { flex: 1; overflow: auto; padding: 10px 12px 14px; scrollbar-width: thin; scrollbar-color: rgba(232, 194, 122, 0.25) transparent; }
.rb-note { display: flex; gap: 8px; align-items: flex-start; margin: 0 2px 10px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.rb-note .ico { width: 15px; height: 15px; flex: none; margin-top: 1px; color: var(--gold); }
.rule { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 12px; margin-bottom: 8px; border-radius: 14px; border: 1px solid var(--line); background: rgba(14, 9, 6, 0.4); }
.rule.now { border-color: rgba(232, 194, 122, 0.55); background: linear-gradient(135deg, rgba(232, 194, 122, 0.12), rgba(14, 9, 6, 0.4)); }
.rule .rb-pic { width: 92px; height: auto; max-height: 120px; object-fit: contain; align-self: start; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.5)); }
.rule h3 { margin: 0 0 4px; font: 500 20px/1.15 var(--serif); color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rule h3 .pill { font: 600 9.5px/1.2 var(--caps); letter-spacing: 0.14em; text-transform: uppercase; }
.rule .rb-line { margin: 0 0 6px; font-size: 13.5px; line-height: 1.45; color: var(--gold-2); }
.rule:not(.now) .rb-line { color: var(--muted); }
.rule .rb-text { margin: 0 0 6px; font-size: 13px; line-height: 1.5; color: var(--muted); }
.rule > div { min-width: 0; }
.rule .rb-link { margin: 0 0 0 -10px; gap: 6px; color: var(--gold-2); text-align: left; white-space: normal; max-width: calc(100% + 10px); }
.rule .rb-link .ico { width: 14px; height: 14px; flex: none; }
/* Developer mode: the version line in Settings and the frame-rate readout. */
.ver { display: block; width: 100%; margin: 14px 0 0; padding: 6px 0; background: none; border: 0; color: var(--faint); font: 500 11.5px/1.3 var(--mono); text-align: center; cursor: default; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.dev-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dev-row .text-in { flex: 1; min-width: 0; font: 12.5px/1.3 var(--mono); }
.dev-row select { flex: 1; min-width: 0; background: var(--sunk); border: 1px solid var(--line-2); border-radius: 9px; padding: 7px 9px; }
.fps { position: fixed; left: 50%; top: calc(var(--safe-t) + 4px); transform: translateX(-50%); z-index: 60; padding: 3px 9px; border-radius: 8px; background: rgba(0, 0, 0, 0.72); color: #9fe870; font: 600 11px/1.3 var(--mono); pointer-events: none; white-space: nowrap; }
.moves-wrap { flex: 1; overflow: auto; padding: 8px 0; min-height: 60px; scrollbar-width: thin; scrollbar-color: rgba(232, 194, 122, 0.25) transparent; }
.moves { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 2.9em 1fr 1fr; font: 14px/1.85 var(--mono); }
.moves li { display: contents; }
.moves .n { color: var(--faint); text-align: right; padding-right: 10px; }
.moves .m { padding: 0 8px; border-radius: 7px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.moves .m:hover { background: rgba(232, 194, 122, 0.08); }
.moves .m.cur { background: rgba(232, 194, 122, 0.2); color: #fff3dc; }
.moves .empty { grid-column: 1 / -1; color: var(--faint); font-family: var(--body); font-size: 13.5px; padding: 6px 16px; line-height: 1.5; }
.move-form { display: flex; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--line); }
.move-form .text-in { min-height: 36px; padding: 7px 10px; font-size: 13.5px; }
.cls { font: 700 10px/1 var(--body); padding: 3px 5px; border-radius: 5px; letter-spacing: 0.02em; }
.cls.brilliant { background: #1fb5c9; color: #04252a; } .cls.best { background: #7fd6a4; color: #0b2a18; } .cls.excellent { background: #9ad58a; color: #13290d; }
.cls.good { background: rgba(232, 194, 122, 0.16); color: var(--muted); } .cls.inaccuracy { background: #f0c26a; color: #2a1a05; } .cls.mistake { background: #f08a4b; color: #2a1205; } .cls.blunder { background: #e5484d; color: #fff; }
.coach { margin: 12px; padding: 14px; border-radius: 16px; background: linear-gradient(135deg, rgba(232, 194, 122, 0.12), rgba(194, 57, 95, 0.1)); border: 1px solid rgba(232, 194, 122, 0.35); display: grid; grid-template-columns: 52px 1fr; gap: 12px; animation: rise .45s var(--ease) both; }
.coach.rival { background: linear-gradient(135deg, rgba(120, 160, 220, 0.1), rgba(232, 194, 122, 0.08)); }
.coach .face { width: 52px; height: 52px; }
.coach .face img { width: 100%; height: 100%; }
.coach b { font: 600 10.5px/1.3 var(--caps); letter-spacing: 0.16em; color: var(--gold-2); text-transform: uppercase; }
.coach p { margin: 4px 0 10px; font-size: 14.5px; line-height: 1.5; }
.coach.rival p { font: italic 500 17px/1.4 var(--serif); }
.coach .row { justify-content: flex-start; gap: 6px; margin: 0; }
.actionbar { position: absolute; bottom: calc(var(--safe-b) + 16px); left: calc((100% - var(--col) - 32px) / 2); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 7px; border-radius: 999px; z-index: 7; max-width: calc(100% - var(--col) - 64px); overflow-x: auto; scrollbar-width: none; }
.actionbar .btn { border-radius: 999px; border-color: transparent; background: transparent; min-height: 44px; padding: 0 16px; font: 500 13.5px/1 var(--body); flex: none; }
.actionbar .btn:hover:not(:disabled) { background: rgba(232, 194, 122, 0.1); }
.actionbar .btn.primary, .actionbar .btn.gold { border-color: #fbe7b4; background: linear-gradient(180deg, #fbe6ad, #e9c27a 45%, #c38f3f); color: #2a1606; font: 600 11.5px/1 var(--caps); }
.actionbar .btn.primary:hover:not(:disabled), .actionbar .btn.gold:hover:not(:disabled) { background: linear-gradient(180deg, #fff0c4, #f2cf8c 45%, #cf9a48); border-color: #fff3cf; }
.actionbar .btn.warn { border-color: rgba(255, 122, 110, 0.6); color: #ffd6d1; }
.actionbar .sep { width: 1px; height: 24px; background: var(--line-2); margin: 0 4px; flex: none; }
.evalbar { position: absolute; left: max(16px, var(--safe-l)); top: 50%; transform: translateY(-50%); width: 12px; height: min(46vh, 420px); border-radius: 999px; overflow: hidden; background: #2b2420; border: 1px solid var(--line-2); z-index: 6; }
.evalbar i { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, #fffaf0, #e8dccb); transition: height .6s var(--ease); }
.graph { width: 100%; height: 110px; display: block; cursor: pointer; flex: none; }
.sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 14px 4px; }
.sum .acc { padding: 12px; border-radius: 14px; background: rgba(14, 9, 6, 0.5); border: 1px solid var(--line); text-align: center; }
.sum .acc.me { border-color: rgba(232, 194, 122, 0.45); }
.sum .acc small { display: block; font: 600 9.5px/1.2 var(--caps); letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); }
.sum .acc b { display: block; font: 500 34px/1.1 var(--serif); margin: 4px 0 2px; }
.sum .acc span { font-size: 11.5px; color: var(--muted); }
.comment { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14.5px; min-height: 84px; line-height: 1.5; }
.comment .tagline2 { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
.comment .bestline { margin-top: 8px; color: var(--teal); font: 13px/1.4 var(--mono); }
.progress-ring { display: grid; place-items: center; gap: 12px; padding: 30px; text-align: center; color: var(--muted); }
.progress-ring img { width: 84px; height: 84px; animation: floaty 3s ease-in-out infinite; }
.lesson { position: absolute; right: max(16px, var(--safe-r)); top: calc(var(--safe-t) + 70px); bottom: calc(var(--safe-b) + 16px); width: calc(var(--col) + 40px); display: flex; flex-direction: column; overflow: hidden; z-index: 6; }
.lesson header { padding: 16px 20px 14px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; background: linear-gradient(110deg, rgba(232, 194, 122, 0.1), transparent 70%); }
.lesson header img { width: 58px; height: 58px; filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.5)); }
.lesson header h3 { margin: 7px 0 0; font: 500 25px/1.1 var(--serif); }
.lesson .content { flex: 1; overflow: auto; overflow-wrap: break-word; padding: 18px 20px; scrollbar-width: thin; scrollbar-color: rgba(232, 194, 122, 0.25) transparent; }
.lesson .say { font: 500 19px/1.55 var(--serif); margin: 0 0 12px; }
.lesson .prompt { font: 500 22px/1.35 var(--serif); margin: 0 0 12px; }
.lesson footer { display: flex; gap: 8px; padding: 14px 16px; border-top: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.lesson footer .grow { flex: 1; }
/* Words at the table: the English word beside the Hindi, each a button that says it */
.tw { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 12px; }
.tw button { display: grid; grid-template-columns: auto 1fr; column-gap: 9px; align-items: center; text-align: left; min-height: 56px; padding: 9px 12px; border-radius: 14px; border: 1px solid rgba(232, 194, 122, 0.35); background: rgba(232, 194, 122, 0.07); color: var(--ink); cursor: pointer; }
.tw button:hover, .tw button:focus-visible { background: rgba(232, 194, 122, 0.16); border-color: var(--gold); outline: none; }
.tw button:active { transform: scale(0.98); }
.tw svg { grid-row: span 2; width: 20px; height: 20px; fill: none; stroke: var(--gold); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tw b { font: 600 20px/1.2 var(--serif); }
.tw b[lang="hi"] { font: 600 20px/1.35 'Noto Sans Devanagari', 'Kohinoor Devanagari', 'Nirmala UI', Mangal, sans-serif; letter-spacing: 0; }
.tw small { font-size: 12.5px; color: var(--muted); }
.tw-list .tw { margin: 0 0 6px; }
.tw-list .tw b { font-size: 17px; }
.tw-list .tw button { min-height: 46px; padding: 6px 11px; }
.objectives { display: grid; gap: 7px; margin-top: 14px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: rgba(232, 194, 122, 0.05); }
.objectives small { font: 600 10px/1.2 var(--caps); letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
.objectives span { display: flex; gap: 9px; align-items: flex-start; font-size: 14px; color: var(--ink); line-height: 1.4; }
.objectives .ico { width: 15px; height: 15px; color: var(--gold); margin-top: 2px; }
.done-card { text-align: center; padding: 8px 0; }
.done-card .prompt { margin-top: 8px; }
.offer-tools { display: flex; justify-content: center; gap: 8px; margin: 2px 0 6px; }
.done-card.placed .medal { display: block; margin: 0 auto; width: 84px; height: 84px; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.55)); }
.placed-friend { display: flex; align-items: center; gap: 12px; text-align: left; margin: 12px auto; padding: 10px 14px; max-width: 340px; border-radius: 14px; border: 1px solid rgba(232, 194, 122, 0.35); background: rgba(232, 194, 122, 0.08); }
.placed-friend .portrait { width: 56px; height: 56px; flex: none; }
.placed-friend small { display: block; font-size: 12px; color: var(--muted); }
.placed-friend b { display: block; font: 600 18px/1.2 var(--serif); }
.placed-go { justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.big-stars { margin: 4px 0 10px; }
.big-stars .stars { font-size: 40px; letter-spacing: 6px; text-shadow: 0 0 22px rgba(232, 194, 122, 0.45); }
.themes { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(232, 194, 122, 0.4); }
.dots i.on { background: var(--gold); border-color: var(--gold); }
.dots i.ok { background: var(--ok); border-color: var(--ok); }
.dots i.bad { background: var(--danger); border-color: var(--danger); }
.feedback { padding: 11px 14px; border-radius: 13px; margin-top: 12px; font-size: 14.5px; line-height: 1.45; animation: rise .3s var(--ease) both; }
.feedback.ok { background: rgba(143, 214, 168, 0.12); border: 1px solid rgba(143, 214, 168, 0.4); color: #d6f5e3; }
.feedback.bad { background: rgba(255, 122, 110, 0.1); border: 1px solid rgba(255, 122, 110, 0.4); color: #ffe0dc; }
.feedback.hint { background: rgba(79, 216, 196, 0.08); border: 1px solid rgba(79, 216, 196, 0.32); color: #d4fff7; }
.choices { display: grid; gap: 8px; }
.choices .btn { justify-content: flex-start; white-space: normal; text-align: left; padding: 12px 15px; line-height: 1.35; }
.choices .btn.right { border-color: var(--ok); background: rgba(143, 214, 168, 0.14); }
.choices .btn.wrong { border-color: var(--danger); background: rgba(255, 122, 110, 0.1); }
.ideas { margin: 0 0 12px; padding-left: 18px; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
.drill-moves { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 10px 12px; border-radius: 12px; background: rgba(14, 9, 6, 0.5); border: 1px solid var(--line); font: 500 14px/1.5 var(--mono); min-height: 44px; }
.drill-moves .n { color: var(--faint); }
.drill-moves .m.last { color: var(--gold-2); }

/* ------------------------------------------------------------ modals */
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(6, 3, 2, 0.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  padding: max(16px, var(--safe-t)) max(16px, var(--safe-r)) max(16px, var(--safe-b)) max(16px, var(--safe-l)); animation: fade .3s ease both; }
@keyframes fade { from { opacity: 0; } }
.card { position: relative; width: min(600px, 100%); max-height: 100%; overflow: auto; background: linear-gradient(180deg, rgba(40, 25, 18, 0.97), rgba(18, 11, 8, 0.98)); border: 1px solid var(--line-2); border-radius: 24px; padding: 28px; box-shadow: 0 40px 120px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 236, 200, 0.07); animation: pop .45s var(--ease) both; scrollbar-width: thin; }
.card.wide { width: min(980px, 100%); }
.card::before { content: ""; position: absolute; left: 30px; right: 30px; top: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.7; }
@keyframes pop { from { opacity: 0; transform: translateY(16px) scale(0.98); } }
.card h2 { font: 500 34px/1.08 var(--serif); margin: 10px 0 8px; }
.card .x { position: absolute; top: 16px; right: 16px; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.levels label { position: relative; display: block; }
.levels input { position: absolute; opacity: 0; pointer-events: none; }
.levels .lv { display: flex; flex-direction: column; align-items: center; text-align: center; height: 100%; padding: 12px 10px; border: 1px solid var(--line-2); border-radius: 16px; background: rgba(232, 194, 122, 0.04); transition: all .2s; cursor: pointer; }
.levels .lv img { width: 64px; height: 64px; margin-bottom: 6px; }
.levels .lv b { display: block; font: 500 18px/1.1 var(--serif); }
.levels .lv small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; margin-top: 3px; }
.levels .lv i { font-style: normal; font: 600 9.5px/1 var(--caps); letter-spacing: 0.16em; color: var(--gold); margin-top: 4px; }
.levels input:checked + .lv { border-color: var(--gold); background: rgba(232, 194, 122, 0.14); box-shadow: var(--glow); }
.levels input:disabled + .lv { opacity: 0.45; cursor: default; }
.levels input:focus-visible + .lv { outline: 2px solid var(--gold); outline-offset: 2px; }
.promo { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.promo button { display: grid; place-items: center; gap: 6px; padding: 14px 6px 12px; border-radius: 16px; border: 1px solid var(--line-2); background: rgba(232, 194, 122, 0.05); }
.promo button img { width: 70px; height: 70px; }
.promo button:hover { border-color: var(--gold); box-shadow: var(--glow); }
.promo button span { display: block; font: 600 10.5px/1 var(--caps); letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
.result-hero { text-align: center; }
.result-hero .portrait { width: 132px; height: 132px; margin: 0 auto 6px; filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.6)); }
.result-title { font: 500 52px/1 var(--serif) !important; margin: 10px 0 0 !important; padding-bottom: 0.16em; background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.result-badge { display: inline-block; font: 600 11px/1 var(--caps); letter-spacing: 0.2em; text-transform: uppercase; padding: 7px 12px; border-radius: 999px; background: rgba(232, 194, 122, 0.14); color: var(--gold); border: 1px solid rgba(232, 194, 122, 0.4); }
.result-badge.win { background: rgba(143, 214, 168, 0.14); color: var(--ok); border-color: rgba(143, 214, 168, 0.45); }
.result-badge.loss { background: rgba(255, 122, 110, 0.12); color: var(--danger); border-color: rgba(255, 122, 110, 0.4); }
.xpline { display: grid; gap: 8px; margin: 18px 0 6px; padding: 14px; border-radius: 16px; background: rgba(14, 9, 6, 0.5); border: 1px solid var(--line); text-align: left; }
.xpline .top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.xpline .top b { color: var(--gold-2); font-weight: 600; }
.unlocks { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
textarea.share { width: 100%; min-height: 180px; background: var(--sunk); color: var(--ink); border: 1px solid var(--line-2); border-radius: 12px; padding: 12px; font: 12.5px/1.5 var(--mono); }
.code { font: 700 40px/1 var(--mono); letter-spacing: 0.25em; text-align: center; padding: 16px; border-radius: 14px; background: var(--sunk); border: 1px dashed var(--line-2); color: var(--gold-2); }

/* ------------------------------------------------------------ toasts, splash */
.toasts { position: fixed; top: calc(var(--safe-t) + var(--nav-h) + 12px); left: 50%; transform: translateX(-50%); z-index: 60; display: grid; gap: 8px; justify-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 24px); }
body.ingame .toasts { top: calc(var(--safe-t) + 64px); }
.toast { padding: 11px 18px; border-radius: 999px; font-size: 14px; animation: toastIn .5s var(--ease) both; text-align: center; }
.toast.out { animation: toastOut .35s ease both; }
.toast.bad { border-color: rgba(255, 122, 110, 0.5); }
.toast.ach { display: flex; align-items: center; gap: 12px; padding: 10px 20px 10px 10px; border-color: rgba(232, 194, 122, 0.6); box-shadow: var(--shadow), 0 0 40px rgba(232, 194, 122, 0.25); text-align: left; }
.toast.ach i { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-style: normal; background: radial-gradient(circle at 35% 30%, #fff0c4, #d9a54e 60%, #8a5a1e); color: #3a1e06; font-size: 17px; flex: none; }
.toast.ach small { display: block; font: 600 10px/1.2 var(--caps); letter-spacing: 0.18em; color: var(--gold-2); text-transform: uppercase; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-14px) scale(0.96); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(232, 194, 122, 0.15); border-top-color: var(--gold); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; align-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 42%, #2a1810, #0b0605 70%); transition: opacity .9s ease, visibility .9s; }
.splash.gone { opacity: 0; visibility: hidden; }
.splash img { width: 120px; height: 120px; animation: rise 1s var(--ease) both; filter: drop-shadow(0 0 40px rgba(232, 194, 122, 0.25)); }
.splash .wordmark { font-size: clamp(44px, 9vw, 96px); animation: rise 1.1s var(--ease) .1s both; }

/* ------------------------------------------------------------ online (net.js) */
.seek-orb { position: relative; width: 84px; height: 84px; margin: 6px auto 14px; }
.seek-orb i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--gold); opacity: 0; animation: seek 2.4s cubic-bezier(.2, .7, .3, 1) infinite; }
.seek-orb i:nth-child(2) { animation-delay: .8s; } .seek-orb i:nth-child(3) { animation-delay: 1.6s; }
@keyframes seek { 0% { transform: scale(.3); opacity: .9; } 100% { transform: scale(1.2); opacity: 0; } }
.friend-code { font: 600 40px/1 var(--mono); letter-spacing: .28em; text-align: center; padding: 18px 0 18px .28em; margin: 8px 0 16px; border-radius: 16px; background: rgba(232, 194, 122, 0.06); border: 1px solid var(--line-2); color: var(--gold-2); }
.today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.today .mini { padding: 12px 14px; border-radius: 14px; }
.today .mini b { display: block; font: 500 24px/1.1 var(--serif); margin-top: 4px; }

/* ------------------------------------------------------------ the Club (club.js) */
.club .cl-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 12px; }
.club .cl-head h3 { font: 500 24px/1.15 var(--serif); margin: 0; }
.club .cl-head p { margin: 0; font-size: 14px; }
.cl-now { padding: 20px 22px; margin-bottom: 18px; }
.cl-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.cl-person, .cl-friend { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: rgba(232, 194, 122, 0.04); border: 1px solid var(--line); min-width: 0; }
.cl-person.live { border-color: rgba(143, 214, 168, 0.4); }
.cl-pmain { flex: 1; min-width: 0; }
.cl-pname { font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.cl-pmeta { color: var(--muted); font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }
.cl-av { width: 36px; height: 36px; border-radius: 50%; flex: none; object-fit: cover; }
.cl-av.init { display: inline-grid; place-items: center; background: linear-gradient(160deg, #5c3d22, #2a1a10); border: 1px solid var(--line-2); color: var(--gold-2); font: 600 15px/1 var(--body); }
.cl-row .cl-av, .cl-row .avatar { width: 28px; height: 28px; font-size: 12px; }
.cl-tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font: 500 10.5px/1.6 var(--body); letter-spacing: .04em; text-transform: uppercase; vertical-align: middle; }
.cl-tag.ai { color: #cfe2ff; background: rgba(90, 130, 200, 0.18); border: 1px solid rgba(140, 180, 255, 0.35); }
.cl-tag.live { color: #d6f5e3; background: rgba(143, 214, 168, 0.14); border: 1px solid rgba(143, 214, 168, 0.4); }
.cl-follow { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; color: var(--gold-2); font-size: 12.5px; flex: none; }
.cl-follow .ico { width: 14px; height: 14px; }
.cl-follow.on { background: rgba(232, 194, 122, 0.16); border-color: var(--gold); }
.cl-split { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.cl-side { display: grid; gap: 18px; min-width: 0; }
.cl-panel { padding: 20px 22px; min-width: 0; }
.cl-pools { margin-bottom: 10px; }
.cl-filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.cl-filters button { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: rgba(232, 194, 122, 0.04); color: var(--muted); font-size: 13.5px; max-width: 100%; }
.cl-filters button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cl-filters button .ico { width: 15px; height: 15px; flex: none; }
.cl-filters button.on { border-color: var(--gold); background: rgba(232, 194, 122, 0.16); color: var(--gold-2); }
.cl-board { display: grid; gap: 3px; }
.cl-row { display: grid; grid-template-columns: 34px minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, .9fr) 56px; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 11px; background: rgba(232, 194, 122, 0.035); font-size: 14px; }
.cl-row.head { background: none; color: var(--faint); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; padding-top: 0; padding-bottom: 4px; }
.cl-row.me { background: rgba(232, 194, 122, 0.15); box-shadow: inset 0 0 0 1px rgba(232, 194, 122, 0.35); }
.cl-row .num { text-align: right; font: 600 14px/1 var(--body); font-variant-numeric: lining-nums tabular-nums; }
.cl-rk { color: var(--muted); font-variant-numeric: tabular-nums; text-align: center; }
.cl-rk.medal { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; font: 700 12px/1 var(--body); color: #2a1a0c; justify-self: center; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 2px 6px rgba(0, 0, 0, .4); }
.cl-rk.m1 { background: linear-gradient(160deg, #fff0b8, #d9a54e 60%, #8a5a1e); }
.cl-rk.m2 { background: linear-gradient(160deg, #ffffff, #b9c0cc 60%, #6d7482); }
.cl-rk.m3 { background: linear-gradient(160deg, #ffd2a8, #c47a3a 60%, #6a3410); }
.cl-player { display: flex; align-items: center; gap: 9px; min-width: 0; }
.cl-nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.cl-nm em { color: var(--gold-2); font-style: normal; font-weight: 400; }
.cl-nm .cl-tag { margin-left: 6px; }
.cl-loc { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.cl-lg { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; min-width: 0; }
.cl-lg span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-badge { flex: none; }
.cl-gap { text-align: center; color: var(--faint); line-height: 1; padding: 2px 0; }
.cl-note { color: var(--faint); font-size: 13px; margin: 12px 0 0; line-height: 1.5; }
.cl-loading { padding: 18px 4px; }
.linkish { background: none; border: 0; padding: 0; color: var(--gold-2); text-decoration: underline; text-underline-offset: 3px; font: inherit; cursor: pointer; }
.cl-tiers { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.cl-tiers li { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; padding: 5px 10px; border-radius: 11px; }
.cl-tiers li b { font-weight: 500; } .cl-tiers li small { color: var(--faint); font-variant-numeric: tabular-nums; }
.cl-tiers li.on { background: rgba(232, 194, 122, 0.15); box-shadow: inset 0 0 0 1px rgba(232, 194, 122, 0.35); }
.cl-tiers li.on small { color: var(--gold-2); }
.cl-next { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.cl-next > div { flex: 1; } .cl-next p { margin: 0 0 6px; font-size: 14px; } .cl-next small { display: block; margin-top: 6px; font-size: 12px; }
.cl-next-done { display: flex; align-items: center; gap: 8px; color: var(--gold-2); margin: 14px 0 0; }
.cl-friend-list { display: grid; gap: 8px; margin-bottom: 12px; }
.cl-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 6px 4px; }
.cl-empty > .ico { width: 30px; height: 30px; color: var(--gold); }
.cl-empty p { margin: 8px 0 12px; }
.cl-loc-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cl-select { position: relative; flex: 1 1 150px; min-width: 0; display: flex; align-items: center; }
.cl-select .ico { position: absolute; left: 12px; width: 16px; height: 16px; color: var(--gold); pointer-events: none; }
.cl-select select { width: 100%; min-height: 42px; padding: 8px 12px 8px 36px; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line-2); color: var(--ink); font: inherit; font-size: 14px; }
.cl-select select:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(232, 194, 122, 0.15); }
@media (max-width: 900px), (max-height: 500px) and (orientation: landscape) and (pointer: coarse) {
  .cl-split { grid-template-columns: 1fr; }
  .cl-people { grid-template-columns: 1fr; }
  .cl-people > :nth-child(n+5) { display: none; }
  .cl-row { grid-template-columns: 28px minmax(0, 1fr) minmax(0, .9fr) 48px; gap: 8px; }
  .cl-row .cl-loc { display: none; }
  .cl-now, .cl-panel { padding: 16px 14px; }
}
@media (max-width: 420px) {
  .cl-row { grid-template-columns: 26px minmax(0, 1fr) 30px 46px; }
  .cl-row .cl-lg span, .cl-row.head .cl-lg { visibility: hidden; }
}

/* ------------------------------------------------------------ missions, season, store */
.missions { padding: 16px 18px; border-radius: 20px; display: grid; gap: 10px; }
.missions .mh { display: flex; justify-content: space-between; align-items: center; }
.mission { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; }
.mission > i { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-2); color: var(--gold); font-style: normal; }
.mission > i .ico { width: 15px; height: 15px; }
.mission b { font-size: 14px; font-weight: 500; display: block; margin-bottom: 5px; }
.mission small { text-align: right; color: var(--muted); font-size: 11.5px; line-height: 1.25; font-variant-numeric: tabular-nums; }
