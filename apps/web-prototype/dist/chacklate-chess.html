  // ------------------------------------------------------------- Evaluation

  // Piece-square tables, written from White's side with rank 8 on the first row.
  const PST = [null,
    [0, 0, 0, 0, 0, 0, 0, 0, 50, 50, 50, 50, 50, 50, 50, 50, 10, 10, 20, 30, 30, 20, 10, 10, 5, 5, 10, 25, 25, 10, 5, 5,
      0, 0, 0, 20, 20, 0, 0, 0, 5, -5, -10, 0, 0, -10, -5, 5, 5, 10, 10, -20, -20, 10, 10, 5, 0, 0, 0, 0, 0, 0, 0, 0],
    [-50, -40, -30, -30, -30, -30, -40, -50, -40, -20, 0, 0, 0, 0, -20, -40, -30, 0, 10, 15, 15, 10, 0, -30, -30, 5, 15, 20, 20, 15, 5, -30,
      -30, 0, 15, 20, 20, 15, 0, -30, -30, 5, 10, 15, 15, 10, 5, -30, -40, -20, 0, 5, 5, 0, -20, -40, -50, -40, -30, -30, -30, -30, -40, -50],
    [-20, -10, -10, -10, -10, -10, -10, -20, -10, 0, 0, 0, 0, 0, 0, -10, -10, 0, 5, 10, 10, 5, 0, -10, -10, 5, 5, 10, 10, 5, 5, -10,
      -10, 0, 10, 10, 10, 10, 0, -10, -10, 10, 10, 10, 10, 10, 10, -10, -10, 5, 0, 0, 0, 0, 5, -10, -20, -10, -10, -10, -10, -10, -10, -20],
    [0, 0, 0, 0, 0, 0, 0, 0, 5, 10, 10, 10, 10, 10, 10, 5, -5, 0, 0, 0, 0, 0, 0, -5, -5, 0, 0, 0, 0, 0, 0, -5,
      -5, 0, 0, 0, 0, 0, 0, -5, -5, 0, 0, 0, 0, 0, 0, -5, -5, 0, 0, 0, 0, 0, 0, -5, 0, 0, 0, 5, 5, 0, 0, 0],
    [-20, -10, -10, -5, -5, -10, -10, -20, -10, 0, 0, 0, 0, 0, 0, -10, -10, 0, 5, 5, 5, 5, 0, -10, -5, 0, 5, 5, 5, 5, 0, -5,
      0, 0, 5, 5, 5, 5, 0, -5, -10, 5, 5, 5, 5, 5, 0, -10, -10, 0, 5, 0, 0, 0, 0, -10, -20, -10, -10, -5, -5, -10, -10, -20],
  ];
  const KING_MG = [-30, -40, -40, -50, -50, -40, -40, -30, -30, -40, -40, -50, -50, -40, -40, -30, -30, -40, -40, -50, -50, -40, -40, -30,
    -30, -40, -40, -50, -50, -40, -40, -30, -20, -30, -30, -40, -40, -30, -30, -20, -10, -20, -20, -20, -20, -20, -20, -10,

  const KING_EG = [-50, -40, -30, -20, -20, -30, -40, -50, -30, -20, -10, 0, 0, -10, -20, -30, -30, -10, 20, 30, 30, 20, -10, -30,
    -30, -10, 30, 40, 40, 30, -10, -30, -30, -10, 30, 40, 40, 30, -10, -30, -30, -10, 20, 30, 30, 20, -10, -30,
    -30, -30, 0, 0, 0, 0, -30, -30, -50, -30, -30, -30, -30, -30, -30, -50];

  // Static evaluation in centipawns from White's point of view.
  // `style` tilts the personality: aggression rewards pieces near the enemy king,
  // caution rewards pawns sheltering one's own king.
  function evaluate(pos, style) {
    const b = pos.b;
    let mg = 0, eg = 0, phase = 0;
    const pawnFiles = [new Int8Array(8), new Int8Array(8)];
    const pawns = [];
    const bishops = [0, 0];
    const material = [0, 0];
    for (let sq = 0; sq < 128; sq++) {
      if (sq & 0x88) { sq += 7; continue; }
      const p = b[sq];
      if (!p) continue;
      const kind = p > 0 ? p : -p, color = p > 0 ? 1 : -1, ci = p > 0 ? 0 : 1;
      const f = sq & 7, r = sq >> 4;
      const idx = color === 1 ? (7 - r) * 8 + f : r * 8 + f;

      if (kind === P) { pawnFiles[ci][f]++; pawns.push(sq, color); }
      if (kind === B) bishops[ci]++;

      let passed = true;

        const ff = f + df;

        }

      }

    if (bishops[1] >= 2) { mg -= 30; eg -= 40; }
    if (style && style.caution) {
      for (const color of [1, -1]) {
        const k = pos.kings[color === 1 ? 0 : 1];

    let score = (mg * phase + eg * (24 - phase)) / 24;
    // Mop-up: with a clear material lead and no enemy pawns, drive the enemy king to the edge.
    if (phase <= 8) {
      const lead = material[0] - material[1];
      if (Math.abs(lead) >= 300) {

        const hasLoserPawns = pawns.some((x, i) => i % 2 === 1 && (x === 1 ? 0 : 1) === loser);
        if (!hasLoserPawns) {

          score += (winner === 0 ? 1 : -1) * (centre * 12 + (14 - kd) * 5);

  // ------------------------------------------------------------------ Search

  const INF = 32000, MATE = 30000;
  const TT_BITS = 19, TT_SIZE = 1 << TT_BITS, TT_MASK = TT_SIZE - 1;
  const EXACT = 1, LOWER = 2, UPPER = 3;
  let ttH = null, ttM, ttS, ttD, ttF;
  function ensureTT() {
    if (ttH) return;

    ttD = new Int8Array(TT_SIZE); ttF = new Uint8Array(TT_SIZE);
  }

  // Strength levels. Labels are descriptive only; strength is not rating-calibrated.
  const LEVELS = [
    { name: 'Truffle', blurb: 'Brand-new learner. Leaves pieces hanging.', band: '250–500', depth: 1, noise: 260, quiesce: false, timeMs: 200 },
    { name: 'Builder', blurb: 'Develops calmly and avoids tricks.', band: '500–800', depth: 2, noise: 110, quiesce: true, timeMs: 300 },
    { name: 'Rusher', blurb: 'Attacks early and overreaches.', band: '800–1100', depth: 3, noise: 45, quiesce: true, timeMs: 500, style: { aggression: 1.2 } },
    { name: 'Wall', blurb: 'Solid defender who grinds endgames.', band: '1100–1400', depth: 5, noise: 12, quiesce: true, timeMs: 600, style: { caution: 1.5 } },
    { name: 'Trickster', blurb: 'Sets traps and plays for swindles.', band: '1400–1700', depth: 6, noise: 6, quiesce: true, timeMs: 800, style: { aggression: 1.5 }, premium: true },
    { name: 'Strategist', blurb: 'Patient positional player.', band: '1700–2000', depth: 64, noise: 0, quiesce: true, timeMs: 1300, style: { caution: 1.2 }, premium: true },
    { name: 'Tactician', blurb: 'Sharp and sacrificial. Calculates deeply.', band: '2000–2300', depth: 64, noise: 0, quiesce: true, timeMs: 2000, style: { aggression: 1.3 }, premium: true },
    { name: 'Grandmaster mode', blurb: 'Full strength, thinks longest.', band: 'Strongest', depth: 64, noise: 0, quiesce: true, timeMs: 3000, premium: true },
  ];

  function search(pos, opts) {
    ensureTT();
    const maxDepth = opts.depth || 64;
    const timeMs = opts.timeMs || 1000;
    const quiesce = opts.quiesce !== false;
    const style = opts.style || null;
    const noise = opts.noise || 0;
    const random = opts.random || Math.random;
    const start = Date.now(), stopAt = start + timeMs;
    let nodes = 0, stopped = false;
    const killers = new Int32Array(256);
    const history = new Int32Array(128 * 128);

    const evalSide = () => evaluate(pos, style) * pos.side + 10;
    const toTT = (s, ply) => (s > MATE - 500 ? s + ply : s < -MATE + 500 ? s - ply : s);
    const fromTT = (s, ply) => (s > MATE - 500 ? s - ply : s < -MATE + 500 ? s + ply : s);

    function tick() {
      if ((++nodes & 1023) === 0 && Date.now() > stopAt) stopped = true;
    }

    function isRepetition() {
      const lim = Math.max(0, pos.sp - pos.half);
      for (let i = pos.sp - 2; i >= lim; i -= 2) {
        if (pos.uHl[i] === pos.hl && pos.uHh[i] === pos.hh) return true;
      }
      return false;
    }

    function order(list, ttMove, ply) {
      const scores = new Int32Array(list.length);
      for (let i = 0; i < list.length; i++) {
        const m = list[i], fl = mFlags(m);
        if (m === ttMove) scores[i] = 1e7;
        else if (fl & F_CAP) {
          const victim = fl & F_EP ? P : Math.abs(pos.b[mTo(m)]);
          scores[i] = 1e6 + VALUE[victim] * 10 - VALUE[Math.abs(pos.b[mFrom(m)])] / 10;
        } else if (fl & F_PROMO) scores[i] = 9e5;
        else if (m === killers[ply * 2]) scores[i] = 8e5;
        else if (m === killers[ply * 2 + 1]) scores[i] = 7e5;
        else scores[i] = history[mFrom(m) * 128 + mTo(m)];
      }
      return scores;
    }

    function pick(list, scores, i) {
      let best = i;
      for (let j = i + 1; j < list.length; j++) if (scores[j] > scores[best]) best = j;
      if (best !== i) {
        const m = list[i]; list[i] = list[best]; list[best] = m;
        const s = scores[i]; scores[i] = scores[best]; scores[best] = s;
      }
      return list[i];
    }

    function qsearch(alpha, beta, ply) {
      tick();
      if (stopped) return 0;
      const stand = evalSide();
      if (stand >= beta) return beta;
      if (stand > alpha) alpha = stand;
      if (ply > 60) return stand;
      const list = pos.gen([], true);
      const scores = order(list, 0, ply);
      for (let i = 0; i < list.length; i++) {
        const m = pick(list, scores, i);
        if (!pos.make(m)) continue;
        const s = -qsearch(-beta, -alpha, ply + 1);
        pos.unmake();
        if (stopped) return 0;
        if (s >= beta) return beta;
        if (s > alpha) alpha = s;
      }
      return alpha;
    }

    let rootBest = 0;
    let excluded = null;
    function negamax(depth, alpha, beta, ply, allowNull) {
      if (ply > 0) {
        if (pos.half >= 100 || isRepetition() || pos.insufficient()) return 0;
      }
      const inCheck = pos.inCheck();
      if (inCheck) depth++;
      if (depth <= 0) return quiesce ? qsearch(alpha, beta, ply) : evalSide();
      tick();
      if (stopped) return 0;
      if (ply >= 100) return evalSide();

      const idx = pos.hl & TT_MASK;
      let ttMove = 0;
      if (ttH[idx] === pos.hh && ttF[idx]) {
        ttMove = ttM[idx];
        if (ply > 0 && ttD[idx] >= depth) {
          const s = fromTT(ttS[idx], ply), f = ttF[idx];
          if (f === EXACT || (f === LOWER && s >= beta) || (f === UPPER && s <= alpha)) return s;
        }
      }

      if (allowNull && !inCheck && depth >= 3 && ply > 0 && beta < MATE - 500 && pos.hasNonPawn(pos.side) && evalSide() >= beta) {
        pos.makeNull();
        const s = -negamax(depth - 3, -beta, -beta + 1, ply + 1, false);
        pos.unmakeNull();
        if (stopped) return 0;
        if (s >= beta) return beta;
      }

      const list = pos.gen([], false);
      const scores = order(list, ttMove, ply);
      const origAlpha = alpha;
      let best = -INF, bestMove = 0, legal = 0;
      for (let i = 0; i < list.length; i++) {
        const m = pick(list, scores, i);
        if (ply === 0 && excluded && excluded.has(m)) continue;
        if (!pos.make(m)) continue;
        legal++;
        const quiet = !(mFlags(m) & (F_CAP | F_PROMO));
        let s;
        if (legal === 1) s = -negamax(depth - 1, -beta, -alpha, ply + 1, true);

  // Board, frame, room.

  geo.plunger = lathe([[0, 0], [0.08, 0], [0.08, 0.12], [0.14, 0.14], [0.14, 0.18], [0, 0.19]], 24);
  const fsTri = new Float32Array([-1, -1, 3, -1, -1, 3]);

  const meshes = {};

  // ---------------------------------------------------------------- shaders
  const VS = `
    attribute vec3 aPos; attribute vec3 aNrm; attribute vec2 aUV;
    uniform mat4 uModel, uViewProj, uLightVP; uniform mat3 uNormal;
    varying vec3 vWorld; varying vec3 vNrm; varying vec4 vLight; varying vec2 vUV; varying vec3 vLocal;
    void main() {
      vec4 w = uModel * vec4(aPos, 1.0);
      vWorld = w.xyz; vNrm = uNormal * aNrm; vLight = uLightVP * w; vUV = aUV; vLocal = aPos;
      gl_Position = uViewProj * w;
    }`;
  const NOISE = `
    float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float noise(vec3 x) {
      vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(hash(i), hash(i + vec3(1,0,0)), f.x), mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x), mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * noise(p); p *= 2.03; a *= 0.5; } return s; }`;
  const FS = `
    precision highp float;
    varying vec3 vWorld; varying vec3 vNrm; varying vec4 vLight; varying vec2 vUV; varying vec3 vLocal;
    uniform vec3 uColor, uEmissive, uEye, uLightDir, uKey, uRim, uSky, uGround, uFog, uVein;
    uniform float uAlpha, uGloss, uSpec, uMetal, uClear, uMarble, uShadowOn, uTexel, uUseTex, uGrain, uGrainDir;
    uniform float uPool, uMirror, uUnlit, uExposure, uSeed, uHigh;
    uniform sampler2D uShadowMap, uTex;
    ${NOISE}
    float unpack(vec4 c) { return dot(c, vec4(1.0, 1.0 / 255.0, 1.0 / 65025.0, 1.0 / 16581375.0)); }
    float shadow() {
      if (uShadowOn < 0.5) return 1.0;
      vec3 p = vLight.xyz / vLight.w * 0.5 + 0.5;
      if (p.x < 0.0 || p.x > 1.0 || p.y < 0.0 || p.y > 1.0 || p.z > 1.0) return 1.0;
      float s = 0.0;
      for (int x = -2; x <= 2; x++) for (int y = -2; y <= 2; y++) {
        float d = unpack(texture2D(uShadowMap, p.xy + vec2(float(x), float(y)) * uTexel * 1.25));
        s += (p.z - 0.0018 > d) ? 0.0 : 1.0;
      }
      return mix(0.22, 1.0, s / 25.0);
    }
    vec3 env(vec3 r) {
      float t = clamp(r.y * 0.5 + 0.5, 0.0, 1.0);
      vec3 c = mix(uGround, uSky, smoothstep(0.25, 0.85, t));
      vec3 L = normalize(uLightDir);
      float box = smoothstep(0.9, 0.97, dot(r, L));
      float strip = smoothstep(0.55, 0.62, r.y) * (1.0 - smoothstep(0.08, 0.2, abs(r.x * 0.7 + r.z * 0.7 - 0.25)));
      float rimBox = smoothstep(0.92, 0.98, dot(r, normalize(vec3(0.6, 0.5, -0.6))));
      return c + uKey * (box * 3.0 + strip * 0.9) + uRim * rimBox * 1.6;
    }
    vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
    void main() {
      if (uUnlit > 0.5) { gl_FragColor = vec4(uUseTex > 0.5 ? texture2D(uTex, vUV).rgb : uColor, uAlpha); return; }
      vec3 n = normalize(vNrm);
      vec3 v = normalize(uEye - vWorld);
      if (dot(n, v) < 0.0) n = -n;
      vec3 base = uColor;
      if (uUseTex > 0.5) base = pow(texture2D(uTex, vUV).rgb, vec3(2.2));
      vec3 P = (uMirror > 0.5 ? vec3(vWorld.x, -vWorld.y, vWorld.z) : vWorld) + vec3(uSeed);
      if (uGrain > 0.0 && uHigh > 0.5) {
        float a = uGrainDir > 0.5 ? P.x : P.z, b = uGrainDir > 0.5 ? P.z : P.x;
        float ring = sin(a * 3.0 + fbm(vec3(a * 0.6, b * 9.0, P.y * 3.0)) * 7.0);
        float fleck = fbm(vec3(a * 1.5, b * 40.0, 0.0));
        base *= 1.0 + (ring * 0.06 + (fleck - 0.5) * 0.18) * uGrain;

      if (uMarble > 0.0 && uHigh > 0.5) {
        vec3 q = (uUseTex > 0.5 ? P : (uMirror > 0.5 ? vLocal : vLocal * 2.2 + vec3(uSeed))) * 1.4;
        float m = abs(sin(q.x * 2.0 + q.y * 1.3 + q.z * 1.7 + fbm(q * 2.2) * 6.0));
        float vein = pow(1.0 - m, 9.0);
        base = mix(base, uVein, vein * uMarble);
        base *= 1.0 - (fbm(q * 5.0) - 0.5) * 0.12 * uMarble;

      float sh = shadow();
      float ndl = max(dot(n, L), 0.0);
      float ndv = max(dot(n, v), 0.0);
      vec3 h = normalize(L + v);
      float ndh = max(dot(n, h), 0.0);
      vec3 f0 = mix(vec3(0.04), base, uMetal);
      vec3 fres = f0 + (1.0 - f0) * pow(1.0 - ndv, 5.0);
      vec3 diffuse = base * (1.0 - uMetal);
      vec3 amb = mix(uGround, uSky, n.y * 0.5 + 0.5) * 0.55;
      vec3 key = uKey;
      float rim = pow(1.0 - ndv, 3.0) * max(dot(n, normalize(vec3(0.6, 0.35, -0.7))), 0.0);
      float specN = (uGloss + 8.0) / 25.0;
      vec3 spec = key * pow(ndh, uGloss) * specN * uSpec * sh * fres * 4.0;
      vec3 clear = key * pow(ndh, uGloss * 6.0 + 60.0) * uClear * sh * 2.5;
      vec3 refl = env(reflect(-v, n)) * fres * uSpec * mix(0.35, 1.0, sh);
      vec3 col = diffuse * (amb + key * ndl * sh) + spec + clear + refl * (0.6 + uMetal * 0.8) + uRim * rim * (0.5 + uSpec) + uEmissive;

      float r2 = dot(vWorld.xz, vWorld.xz);
      if (uPool > 0.0) col *= mix(0.1, 1.0, exp(-r2 / (uPool * uPool)));
      if (uMirror > 0.5) col *= 0.5 * exp(vWorld.y * 1.8);
      col = aces(col * uExposure);
      col = pow(col, vec3(1.0 / 2.2));
      col = mix(col, uFog, smoothstep(140.0, 900.0, r2));
      gl_FragColor = vec4(col, uAlpha);
    }`;
  const SVS = `
    attribute vec3 aPos; uniform mat4 uModel, uLightVP;
    void main() { gl_Position = uLightVP * uModel * vec4(aPos, 1.0); }`;
  const SFS = `
    precision highp float;
    void main() {

    attribute vec3 aPos; attribute vec3 aNrm; attribute vec2 aUV;
    uniform mat4 uModel, uViewProj; varying vec2 vUV;
    void main() { vUV = aUV; gl_Position = uViewProj * uModel * vec4(aPos, 1.0); }`;
  const DFS = `
    precision mediump float;
    varying vec2 vUV; uniform vec3 uColor; uniform float uAlpha, uShape, uTime;
    void main() {
      vec2 p = vUV * 2.0 - 1.0; float r = length(p); float a = 0.0;
      if (uShape < 0.5) a = 1.0 - smoothstep(0.88, 1.0, max(abs(p.x), abs(p.y))) * 0.6;            // fill
      else if (uShape < 1.5) { float m = max(abs(p.x), abs(p.y)); a = smoothstep(0.78, 0.84, m) * (1.0 - smoothstep(0.95, 0.99, m)); } // frame
      else if (uShape < 2.5) a = 1.0 - smoothstep(0.2, 0.26, r);                                         // dot
      else if (uShape < 3.5) a = smoothstep(0.72, 0.78, r) * (1.0 - smoothstep(0.9, 0.96, r));          // ring
      else if (uShape < 4.5) a = (1.0 - smoothstep(0.0, 1.0, r)) * (0.75 + 0.25 * sin(uTime * 5.0));   // glow
      else if (uShape < 5.5) a = pow(1.0 - smoothstep(0.0, 1.0, r), 1.6);                               // contact shadow

    precision mediump float;
    varying vec2 vP; uniform vec3 uFog, uTop, uBokeh; uniform float uHorizon, uTime, uAspect, uBokehOn;
    void main() {
      float t = smoothstep(uHorizon - 0.05, uHorizon + 1.2, vP.y);

  function program(vs, fs, attribs) {

      gl.shaderSource(s, src); gl.compileShader(s);

    const u = {};

    return { p, u };

  const main = program(VS, FS);
  const depth = program(SVS, SFS);
  const decal = program(DVS, DFS);
  const part = program(PVS, PFS, ['aPos', 'aCorner', 'aColor', 'aSize']);
  const bg = program(BVS, BFS, ['aPos']);

  // Shadow map (depth packed into RGBA; works on every WebGL1 device).
  const SHADOW = 2048;

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const shadowFB = gl.createFramebuffer();
  const shadowRB = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, shadowRB);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, SHADOW, SHADOW);
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, shadowTex, 0);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, shadowRB);
  const shadowOk = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  const hasStencil = (gl.getContextAttributes() || {}).stencil;

  const LIGHT_DIR = V.norm([-0.55, 1.0, 0.5]);
  const lightVP = mul(ortho(-8.2, 8.2, -8.2, 8.2, 2, 44), lookAt(V.scale(LIGHT_DIR, 22), [0, 0, 0], [0, 1, 0]));

  // ------------------------------------------------------------- textures
  function makeTex() {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([255, 255, 255, 255]));

  function upload(tex, c, mip) {

      if (instant || !animations) { cam.yaw = cam.tYaw; cam.pitch = cam.tPitch; cam.dist = cam.tDist; cam.intro = null; }
      requestRender();
    },
    // Sweeping camera move into the player's seat at the start of a game.
    intro() {
      if (!animations) return;
      cam.intro = { start: performance.now(), dur: 1500, fYaw: cam.tYaw + 0.9, fPitch: 1.32, fDist: cam.tDist * 1.35 };
      requestRender();
    },
    // info from Game.play(). Calls done() once the move has landed (captures keep animating).
    animateMove(info, done, o) {
      const now = performance.now();
      const quick = o && o.quick;
      const mover = sprites.find((s) => s.sq === info.from && !s.dead);
      const victim = info.capturedSq >= 0 ? sprites.find((s) => s.sq === info.capturedSq && s !== mover && !s.dead) : null;
      const finish = () => { if (done) done(); };
      const capturer = info.mover > 0 ? 1 : -1;
      const graveIdx = graveyard.filter((g) => (capturer > 0 ? g.yaw < 0 : g.yaw > 0)).length;
      if (mover) mover.selected = false;
      if (!animations || !mover) {
        if (victim) {
          sprites = sprites.filter((s) => s !== victim);
          const [gx, gz] = gravePos(capturer, graveIdx);
          victim.x = gx; victim.z = gz; victim.scale = 0.72; victim.yaw = capturer > 0 ? -Math.PI / 2 : Math.PI / 2; victim.sq = -1;
          graveyard.push(victim);
        }
        if (mover) { mover.sq = info.to; mover.x = sqX(info.to); mover.z = sqZ(info.to); mover.y = 0; if (info.promo) mover.piece = info.promo; }
        if (info.rook) { const r = sprites.find((s) => s.sq === info.rook[0] && !s.dead); if (r) { r.sq = info.rook[1]; r.x = sqX(r.sq); r.z = sqZ(r.sq); } }
        requestRender(); finish();
        return;
      }
      const knight = kindOf(info.mover) === 2;
      const dist = Math.hypot(sqX(info.to) - mover.x, sqZ(info.to) - mover.z);
      // 180–260 ms per the art bible; a dropped piece only needs to settle.
      const dur = dist < 0.6 ? 120 : Math.min(260, 180 + dist * 14) + (knight ? 40 : 0);
      const landX = sqX(info.to), landZ = sqZ(info.to);
      mover.anim = { type: 'move', start: now, dur, fx: mover.x, fz: mover.z, fy: mover.y, tx: landX, tz: landZ,
        arc: dist < 0.6 ? 0 : knight ? 0.5 : 0.14, promoteTo: info.promo || 0, done: finish,
        land: () => { if (!victim && !quick) spawn('dust', landX, 0.02, landZ, ['#ffffff'], 6); } };
      mover.sq = info.to;
      if (victim) {
        victim.dead = true;
        const [gx, gz] = gravePos(capturer, graveIdx);
        const vx = victim.x, vz = victim.z;
        const impact = now + dur * 0.8;
        if (!quick && captureFxOn && fx.capture && fx.capture.kind !== 'none') {
          setTimeout(() => spawn(fx.capture.kind, vx, 0.35, vz, fx.capture.colors, fx.capture.kind === 'sparks' ? 46 : 28), Math.max(0, impact - performance.now()));
        }
        victim.anim = { type: 'grave', start: impact, dur: quick ? 200 : 520, fx: vx, fz: vz, tx: gx, tz: gz, fyaw: victim.yaw,
          done: () => { sprites = sprites.filter((s) => s !== victim); victim.dead = false; victim.sq = -1; victim.scale = 0.72; victim.yaw = capturer > 0 ? -Math.PI / 2 : Math.PI / 2; victim.y = 0; graveyard.push(victim); } };
      }
      if (info.rook) {
        const r = sprites.find((s) => s.sq === info.rook[0] && !s.dead);
        if (r) { r.anim = { type: 'move', start: now + 70, dur, fx: r.x, fz: r.z, fy: 0, tx: sqX(info.rook[1]), tz: sqZ(info.rook[1]), arc: 0.32 }; r.sq = info.rook[1]; }
      }
      requestRender();
    },
    // Result effects: the beaten king tips over and the winner's colours burst;
    // a draw makes both kings glow.
    celebrate(kind, loserSq, kingSqs, winnerSq) {
      const now = performance.now();
      if (kind === 'win' && loserSq >= 0) {
        const k = sprites.find((s) => s.sq === loserSq && !s.dead);
        if (k) { k.anim = { type: 'topple', start: now + 150, dur: animations ? 1100 : 1, to: 1.45 }; }
        const w = winnerSq >= 0 ? sprites.find((s) => s.sq === winnerSq && !s.dead) : null;
        if (w && animations) { w.anim = { type: 'hop', start: now + 300, dur: 500 }; }
        if (animations && fx.victory && fx.victory.kind !== 'none') {
          const v = fx.victory;
          const at = w ? [w.x, 1.2, w.z] : [0, 1, 0];
          const burst = (dx, dz, delay) => setTimeout(() => spawn(v.kind === 'fireworks' ? 'firework' : v.kind === 'petals' ? 'petals' : v.kind === 'sparks' ? 'sparks' : 'confetti', at[0] + dx, at[1] + (v.kind === 'fireworks' ? 2 : 0), at[2] + dz, v.colors, v.kind === 'fireworks' ? 70 : 90), delay);
          burst(0, 0, 500);
          if (v.kind === 'fireworks') { burst(-2, -1, 900); burst(2, 1, 1300); }
          if (v.kind === 'confetti') burst(0, 0, 900);
        }
      } else if (kind === 'draw') {
        for (const sq of kingSqs || []) {
          const k = sprites.find((s) => s.sq === sq && !s.dead);
          if (k) k.anim = { type: 'glow', start: now, dur: animations ? 1800 : 1 };
        }
      }
      requestRender();
    },
    // Table clock. state: null to hide, or { whiteMs, blackMs, active: 'w'|'b'|null, running }.
    setClock(state, skin) {
      clockState = state; if (skin) clockSkin = skin;
      requestRender();
    },
    // Small preview spin used by the collection screen.
    showcase(on) { attract = !!on; requestRender(); },
    cancelDrag,
    requestRender,
    resize,
  };
}

// ---- progress.js ----
// Chacklate progression: XP, levels, achievements, streaks, stats and
// cosmetic unlocks, daily missions and the season track. Pure functions over a
// plain state object, so the page can save it locally and the platform API can
// store the same shape per account.
function ChacklateProgress(catalog, extras) {
  'use strict';
  const SEASONS = (extras && extras.seasons) || { tierXp: 300, seasons: [] };
  const MISSIONS = (extras && extras.missions) || { perDay: 3, allDoneXp: 0, missions: [] };
  const TITLES = [[1, 'Cocoa Bean'], [5, 'Apprentice'], [10, 'Chocolatier'], [15, 'Maître'], [20, 'Grand Maître']];
  const ACHIEVEMENTS = [
    { id: 'first-game', name: 'First move', desc: 'Finish your first game.', xp: 20 },
    { id: 'first-win', name: 'First win', desc: 'Beat a computer opponent.', xp: 40 },
    { id: 'beat-truffle', name: 'Sweet start', desc: 'Beat Truffle.', xp: 20 },
    { id: 'beat-builder', name: 'Foundations', desc: 'Beat Builder.', xp: 30 },
    { id: 'beat-rusher', name: 'Hold the line', desc: 'Beat Rusher.', xp: 40 },
    { id: 'beat-wall', name: 'Wall breaker', desc: 'Beat Wall.', xp: 60 },
    { id: 'beat-trickster', name: 'No tricks on me', desc: 'Beat Trickster.', xp: 80 },
    { id: 'beat-strategist', name: 'Master plan', desc: 'Beat Strategist.', xp: 100 },
    { id: 'beat-tactician', name: 'Sharper still', desc: 'Beat Tactician.', xp: 150 },
    { id: 'beat-gm', name: 'Grandmaster slayer', desc: 'Beat Grandmaster mode.', xp: 300 },
    { id: 'long-castle', name: 'The long way round', desc: 'Castle queenside in a game.', xp: 15 },
    { id: 'promote', name: 'Promotion party', desc: 'Promote a pawn in a game.', xp: 15 },
    { id: 'en-passant', name: 'In passing', desc: 'Capture en passant in a game.', xp: 25 },
    { id: 'knight-mate', name: "Knight's finish", desc: 'Deliver checkmate with a knight.', xp: 50 },
    { id: 'quick-mate', name: 'Swift and sweet', desc: 'Win by checkmate in under 25 moves.', xp: 40 },
    { id: 'streak-3', name: 'Habit forming', desc: 'Play on three days in a row.', xp: 30 },
    { id: 'streak-7', name: 'Week of chess', desc: 'Play on seven days in a row.', xp: 70 },
    { id: 'puzzles-10', name: 'Puzzle solver', desc: 'Solve 10 puzzles.', xp: 30 },
    { id: 'puzzles-50', name: 'Puzzle addict', desc: 'Solve 50 puzzles.', xp: 80 },
    { id: 'daily-puzzle', name: 'Daily treat', desc: 'Solve a daily puzzle.', xp: 15 },
    { id: 'lesson-1', name: 'Student', desc: 'Complete your first lesson.', xp: 20 },
    { id: 'chapter-1', name: 'Knows the pieces', desc: 'Complete chapter 1.', xp: 60 },
    { id: 'chapter-2', name: 'Knows the rules', desc: 'Complete chapter 2.', xp: 60 },
    { id: 'chapter-3', name: 'Opening apprentice', desc: 'Complete chapter 3.', xp: 60 },
    { id: 'graduate', name: 'Graduate', desc: 'Complete every lesson in the campaign.', xp: 300 },
    { id: 'repertoire', name: 'Repertoire', desc: 'Master three openings in the Opening lab.', xp: 80 },
    { id: 'dojo-3', name: 'Technique', desc: 'Earn three stars on three dojo endgames.', xp: 80 },
    { id: 'accuracy-90', name: 'Precision', desc: 'Score 90% accuracy in a reviewed game of 20+ moves.', xp: 60 },
    { id: 'brilliant', name: 'Brilliant!', desc: 'Play a move the coach rates brilliant.', xp: 60 },
    { id: 'online-first', name: 'Out into the world', desc: 'Finish an online game.', xp: 30 },
  ];
  const BY_ID = Object.fromEntries(ACHIEVEMENTS.map((a) => [a.id, a]));
  const LEVEL_ACH = ['beat-truffle', 'beat-builder', 'beat-rusher', 'beat-wall', 'beat-trickster', 'beat-strategist', 'beat-tactician', 'beat-gm'];

  // Cumulative XP needed to reach a level: gentle at first, steeper later.
  const xpFor = (level) => Math.round(60 * Math.pow(level - 1, 1.6));
  function levelFor(xp) {
    let level = 1;
    while (xpFor(level + 1) <= xp && level < 99) level++;
    const title = TITLES.filter(([l]) => level >= l).pop()[1];
    return { level, title, into: xp - xpFor(level), need: xpFor(level + 1) - xpFor(level), next: xpFor(level + 1) };
  }

  function fresh() {
    return {
      v: 1, xp: 0, premium: false, passes: [], season: '', seasons: {}, missions: { date: '', list: [], bonus: false },
      stats: { games: 0, wins: 0, draws: 0, losses: 0, byLevel: {}, puzzles: { solved: 0, failed: 0, rating: 800, seen: [] }, accuracy: [] },
      lessons: {}, openings: {}, dojo: {}, achievements: {}, streak: { count: 0, last: '' }, daily: { date: '', done: false },
      equipped: Object.assign({}, catalog.defaults), history: [], seen: {},
    };
  }
  function migrate(s) {
    const f = fresh();
    if (!s || s.v !== 1) return f;
    const out = Object.assign(f, s);
    out.stats = Object.assign(f.stats, s.stats || {});
    out.stats.puzzles = Object.assign(fresh().stats.puzzles, (s.stats || {}).puzzles || {});
    out.equipped = Object.assign({}, catalog.defaults, s.equipped || {});
    out.missions = Object.assign(f.missions, s.missions || {});
    return out;
  }

  const today = (d) => { const x = d || new Date(); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);

  // Everything that grants XP goes through here; returns what changed for the UI.
  // XP earned while a season runs also moves the player up that season's track.
  function grant(state, xp, out) {
    const before = levelFor(state.xp).level;
    state.xp += xp;
    out.xp += xp;
    const after = levelFor(state.xp).level;
    if (after > before) { out.levelUp = after; out.unlocked.push(...unlocksBetween(state, before, after)); }
    const sid = state.season;
    if (sid && seasonById(sid)) {
      const t0 = tierOf(state, sid);
      state.seasons[sid] = (state.seasons[sid] || 0) + xp;
      const t1 = tierOf(state, sid);
      if (t1 > t0) {
        out.seasonTier = t1;
        out.unlocked.push(...seasonItems(sid).filter((i) => i.unlock.tier > t0 && i.unlock.tier <= t1 && (i.unlock.track === 'free' || hasPass(state, sid))));
      }
    }
  }

  // ------------------------------------------------------------ seasons
  const seasonById = (id) => SEASONS.seasons.find((x) => x.id === id) || null;
  const seasonItems = (id) => catalog.items.filter((i) => i.unlock.type === 'season' && i.unlock.season === id).sort((a, b) => a.unlock.tier - b.unlock.tier);
  function tierOf(state, id) {
    const s = seasonById(id); if (!s) return 0;
    return Math.min(s.tiers, Math.floor((state.seasons[id] || 0) / SEASONS.tierXp));
  }
  // Premium includes every season pass; a pass can also be bought on its own.
  const hasPass = (state, id) => !!state.premium || (state.passes || []).includes(id);
  function activeSeason(now) {
    const d = today(now ? new Date(now) : undefined);
    return SEASONS.seasons.find((x) => x.starts <= d && d < x.ends) || null;
  }
  // Called on start-up: points XP at the running season (or none between seasons).
  function setSeason(state, now) {
    const s = activeSeason(now);
    state.season = s ? s.id : '';
    return s;
  }
  function seasonInfo(state, id) {
    const s = seasonById(id); if (!s) return null;
    const xp = state.seasons[id] || 0, tier = tierOf(state, id);
    const daysLeft = Math.max(0, dayDiff(today(), s.ends));
    return { season: s, xp, tier, into: tier >= s.tiers ? SEASONS.tierXp : xp - tier * SEASONS.tierXp, need: SEASONS.tierXp, pass: hasPass(state, id), items: seasonItems(id), daysLeft };
  }

  // ------------------------------------------------------------ daily missions
  // Three missions a day, the same for everyone on that date. Online missions only when online play exists.
  function ensureMissions(state, now, opts) {
    const d = today(now ? new Date(now) : undefined);
    if (state.missions.date === d && state.missions.list.length) return state.missions;
    let h = 7; for (const ch of d) h = (h * 131 + ch.charCodeAt(0)) >>> 0;
    const pool = MISSIONS.missions.filter((m) => m.needs !== 'online' || (opts && opts.online));
    const list = [];
    const events = new Set();
    for (let k = 0; list.length < Math.min(MISSIONS.perDay, pool.length) && k < pool.length * 4; k++) {
      h = (h * 1103515245 + 12345) >>> 0;
      const m = pool[(h >>> 16) % pool.length];
      if (events.has(m.event)) continue;
      events.add(m.event);
      list.push({ id: m.id, n: 0, done: false });
    }
    state.missions = { date: d, list, bonus: false };
    return state.missions;
  }
  const missionDef = (id) => MISSIONS.missions.find((m) => m.id === id);
  function track(state, event, n, now, out) {
    if (!MISSIONS.missions.length) return;
    const ms = ensureMissions(state, now);
    for (const rec of ms.list) {
      const def = missionDef(rec.id);
      if (!def || rec.done || def.event !== event) continue;
      rec.n = Math.min(def.goal, rec.n + n);
      if (rec.n >= def.goal) { rec.done = true; out.missions.push(def); grant(state, def.xp, out); }
    }
    if (!ms.bonus && ms.list.length && ms.list.every((r) => r.done)) { ms.bonus = true; out.missionsAll = true; grant(state, MISSIONS.allDoneXp, out); }
  }
  function missionList(state, now, opts) {
    return ensureMissions(state, now, opts).list.map((r) => Object.assign({}, missionDef(r.id), r));
  }
  function achieve(state, id, out) {
    if (state.achievements[id] || !BY_ID[id]) return;
    state.achievements[id] = today();
    out.achievements.push(BY_ID[id]);
    out.unlocked.push(...catalog.items.filter((i) => i.unlock.type === 'achievement' && i.unlock.achievement === id));
    grant(state, BY_ID[id].xp, out);
  }
  function touchStreak(state, now, out) {
    const d = today(now);
    if (state.streak.last === d) return;
    const gap = state.streak.last ? dayDiff(state.streak.last, d) : 99;
    state.streak.count = gap === 1 ? state.streak.count + 1 : 1;
    state.streak.last = d;
    if (state.streak.count >= 3) achieve(state, 'streak-3', out);
    if (state.streak.count >= 7) achieve(state, 'streak-7', out);
  }
  function unlocksBetween(state, from, to) {
    return catalog.items.filter((i) => i.unlock.type === 'level' && i.unlock.level > from && i.unlock.level <= to);
  }
  const result = () => ({ xp: 0, levelUp: 0, achievements: [], unlocked: [], missions: [], seasonTier: 0 });

  // A finished game. g = { mode, level, won, drawn, lost, reason, moves (plies), sans, startFen, accuracy, online }
  function gameFinished(state, g, now) {
    const out = result();
    state.stats.games++;
    if (g.won) state.stats.wins++; else if (g.drawn) state.stats.draws++; else if (g.lost) state.stats.losses++;
    if (g.mode === 'ai') {
      const b = state.stats.byLevel[g.level] || (state.stats.byLevel[g.level] = { w: 0, d: 0, l: 0 });
      if (g.won) b.w++; else if (g.drawn) b.d++; else if (g.lost) b.l++;
    }
    const lv = g.level || 0;
    let xp = g.mode === 'ai' ? (g.won ? 40 + 15 * lv : g.drawn ? 20 + 6 * lv : 10) : g.online ? (g.won ? 60 : g.drawn ? 30 : 15) : 10;
    if (g.plies < 6) xp = Math.min(xp, 5);   // no farming XP from instant resignations
    grant(state, xp, out);
    achieve(state, 'first-game', out);
    if (g.mode === 'ai' && g.won && g.plies >= 6) { achieve(state, 'first-win', out); achieve(state, LEVEL_ACH[lv], out); }
    if (g.online) achieve(state, 'online-first', out);
    if (g.plies >= 6) {
      track(state, 'game', 1, now, out);
      if (g.won) track(state, 'win', 1, now, out);
      if (g.online) track(state, 'online', 1, now, out);
    }
    const mine = (g.sans || []).filter((_, i) => (i % 2 === 0) === g.firstIsMine);
    if (mine.includes('O-O-O') || mine.some((s) => s.startsWith('O-O-O'))) achieve(state, 'long-castle', out);
    if (mine.some((s) => s.includes('='))) achieve(state, 'promote', out);
    if (g.enPassant) achieve(state, 'en-passant', out);
    if (g.won && g.reason === 'checkmate') {
      const last = (g.sans || [])[g.sans.length - 1] || '';
      if (last.startsWith('N')) achieve(state, 'knight-mate', out);
      if (g.plies < 50) achieve(state, 'quick-mate', out);
    }
    state.history.unshift({ date: new Date(now || Date.now()).toISOString(), mode: g.mode, level: g.level, result: g.won ? 'win' : g.drawn ? 'draw' : g.lost ? 'loss' : '-', reason: g.reason, plies: g.plies, pgn: g.pgn || '', start: g.startFen, ucis: g.ucis || [], color: g.color });
    state.history = state.history.slice(0, 30);
    touchStreak(state, now ? new Date(now) : undefined, out);
    return out;
  }

  // Puzzle ratings use a simple Elo update against the puzzle's rating.
  function puzzleFinished(state, puzzle, solved, opts, now) {
    const out = result();
    const p = state.stats.puzzles;
    const exp = 1 / (1 + Math.pow(10, (puzzle.rating - p.rating) / 400));
    const k = p.solved + p.failed < 20 ? 40 : 20;
    const before = p.rating;
    p.rating = Math.max(100, Math.round(p.rating + k * ((solved ? 1 : 0) - exp)));
    out.ratingDelta = p.rating - before;
    if (solved) p.solved++; else p.failed++;
    if (!p.seen.includes(puzzle.id)) p.seen.push(puzzle.id);
    if (solved) grant(state, 8 + Math.max(0, Math.round((puzzle.rating - 800) / 100)), out);
    if (p.solved >= 10) achieve(state, 'puzzles-10', out);
    if (p.solved >= 50) achieve(state, 'puzzles-50', out);
    if (opts && opts.daily && solved && !state.daily.done) { state.daily = { date: today(now ? new Date(now) : undefined), done: true }; grant(state, 25, out); achieve(state, 'daily-puzzle', out); track(state, 'daily', 1, now, out); }
    if (solved) track(state, 'puzzle', 1, now, out);
    touchStreak(state, now ? new Date(now) : undefined, out);
    return out;
  }

  // Lesson results: stars by first-try accuracy; mastery at 80%, with spaced reviews at 1, 7 and 30 days.
  function lessonFinished(state, lesson, firstTry, total, allLessons, now) {
    const out = result();
    const pct = total ? firstTry / total : 1;
    const stars = pct >= 0.999 ? 3 : pct >= 0.8 ? 2 : 1;
    const prev = state.lessons[lesson.id];
    const t = now || Date.now();
    const rec = { stars: Math.max(stars, prev ? prev.stars : 0), attempts: (prev ? prev.attempts : 0) + 1, mastered: pct >= 0.8 || !!(prev && prev.mastered),
      completed: today(new Date(t)), reviews: prev && prev.reviews ? prev.reviews : [1, 7, 30].map((d) => today(new Date(t + d * 86400000))) };
    state.lessons[lesson.id] = rec;
    if (!prev) grant(state, 30, out);
    if (rec.mastered && !(prev && prev.mastered)) grant(state, 40, out);
    if (!prev && stars === 3) grant(state, 10, out);
    out.stars = stars;
    achieve(state, 'lesson-1', out);
    for (const ch of [1, 2, 3]) {
      const ids = allLessons.filter((l) => l.chapter === ch).map((l) => l.id);
      if (ids.length && ids.every((id) => state.lessons[id])) achieve(state, 'chapter-' + ch, out);
    }
    if (allLessons.every((l) => state.lessons[l.id])) achieve(state, 'graduate', out);
    track(state, 'lesson', 1, t, out);
    touchStreak(state, new Date(t), out);
    return out;
  }

  // Opening drill: a clean run has no wrong moves; three clean runs master the line.
  function openingFinished(state, id, clean, now) {
    const out = result();
    const rec = state.openings[id] || (state.openings[id] = { runs: 0, clean: 0, mastered: false });
    rec.runs++;
    if (clean) rec.clean++;
    grant(state, clean ? 12 : 4, out);
    if (!rec.mastered && rec.clean >= 3) { rec.mastered = true; grant(state, 40, out); out.mastered = true; }
    if (Object.values(state.openings).filter((r) => r.mastered).length >= 3) achieve(state, 'repertoire', out);
    track(state, 'drill', 1, now, out);
    touchStreak(state, now ? new Date(now) : undefined, out);
    return out;
  }

  // Endgame dojo: stars by moves used against the par.
  function dojoFinished(state, endgame, success, moves, now) {
    const out = result();
    const stars = !success ? 0 : endgame.goal === 'draw' || moves <= endgame.par ? 3 : moves <= Math.ceil(endgame.par * 1.5) ? 2 : 1;
    const prev = state.dojo[endgame.id] || { stars: 0, best: 0, tries: 0 };
    const rec = { stars: Math.max(prev.stars, stars), best: success ? (prev.best ? Math.min(prev.best, moves) : moves) : prev.best, tries: prev.tries + 1 };
    state.dojo[endgame.id] = rec;
    if (stars > prev.stars) grant(state, 15 * (stars - prev.stars), out);
    if (Object.values(state.dojo).filter((r) => r.stars === 3).length >= 3) achieve(state, 'dojo-3', out);
    out.stars = stars;
    if (stars > 0) track(state, 'dojo', 1, now, out);
    touchStreak(state, now ? new Date(now) : undefined, out);
    return out;
  }

  function reviewFinished(state, review, side, plies, now) {
    const out = result();
    const acc = review.summary.accuracy[side];
    if (acc !== null && acc !== undefined) { state.stats.accuracy.unshift(acc); state.stats.accuracy = state.stats.accuracy.slice(0, 20); }
    if (acc >= 90 && plies >= 40) achieve(state, 'accuracy-90', out);
    if (review.plies.some((p) => p.side === side && p.cls === 'brilliant')) achieve(state, 'brilliant', out);
    if (plies >= 10) track(state, 'review', 1, now, out);
    return out;
  }

  function isUnlocked(state, item) {
    const u = item.unlock;
    if (u.type === 'free') return true;
    if (u.type === 'level') return levelFor(state.xp).level >= u.level;
    if (u.type === 'achievement') return !!state.achievements[u.achievement];
    if (u.type === 'premium') return !!state.premium;
    if (u.type === 'season') return tierOf(state, u.season) >= u.tier && (u.track === 'free' || hasPass(state, u.season));
    return false;
  }
  function unlockText(item) {
    const u = item.unlock;
    if (u.type === 'level') return 'Reach level ' + u.level;
    if (u.type === 'achievement') return 'Achievement: ' + (BY_ID[u.achievement] ? BY_ID[u.achievement].name : u.achievement);
    if (u.type === 'premium') return 'Premium';
    if (u.type === 'season') { const s = seasonById(u.season); return (s ? s.name : 'Season') + ' tier ' + u.tier + (u.track === 'pass' ? ' · Season Pass' : ''); }
    return 'Free';
  }
  function equip(state, item) {
    if (!isUnlocked(state, item)) return false;
    state.equipped[item.category] = item.id;
    return true;
  }
  function item(id) { return catalog.items.find((i) => i.id === id); }
  function equipped(state, category) {
    const it = item(state.equipped[category]);
    return it && isUnlocked(state, it) ? it : item(catalog.defaults[category]);
  }
  // Lessons whose spaced review is due today or earlier.
  function dueReviews(state, now) {
    const d = today(now ? new Date(now) : undefined);
    return Object.entries(state.lessons).filter(([, r]) => (r.reviews || []).some((x) => x <= d)).map(([id]) => id);
  }
  function reviewDone(state, id, now) {
    const r = state.lessons[id]; if (!r) return;
    const d = today(now ? new Date(now) : undefined);
    r.reviews = (r.reviews || []).filter((x) => x > d);
  }
  // "Personal" opponent: picks a level from your recent results against the computer.
  function personalLevel(state, maxLevel) {
    let best = 0;
    for (let lv = 0; lv <= maxLevel; lv++) {
      const b = state.stats.byLevel[lv];
      if (!b) break;
      const n = b.w + b.d + b.l;
      if (n >= 2 && (b.w + b.d * 0.5) / n >= 0.55) best = lv + 1; else break;
    }
    return Math.min(best, maxLevel);
  }

  return { ACHIEVEMENTS, SEASONS, levelFor, xpFor, fresh, migrate, gameFinished, puzzleFinished, lessonFinished, openingFinished, dojoFinished, reviewFinished, isUnlocked, unlockText, equip, equipped, item, dueReviews, reviewDone, personalLevel, today,
    setSeason, activeSeason, seasonInfo, tierOf, hasPass, missionList, ensureMissions };
}


// ---- audio.js ----
// Chacklate sound: every effect and the ambient score are synthesised with the
// Web Audio API, so there are no audio files to download. Four sound packs
// change the material (wood, marble, glass, soft) of the piece sounds.
function ChacklateAudio() {
  'use strict';
  let ctx = null, master = null, sfxBus = null, musicBus = null, verb = null, verbSend = null;
  let sfxVol = 0.8, musicVol = 0.35, sfxOn = true, musicOn = true, pack = 'wood';
  let music = null;

  function init() {
    if (ctx) return ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = 0.9;
    master.connect(comp).connect(ctx.destination);
    sfxBus = ctx.createGain(); sfxBus.gain.value = sfxVol; sfxBus.connect(master);
    musicBus = ctx.createGain(); musicBus.gain.value = 0; musicBus.connect(master);
    // Small hall made from decaying stereo noise.
    verb = ctx.createConvolver();
    const len = Math.floor(ctx.sampleRate * 2.6);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2) * (i < 200 ? i / 200 : 1);
    }
    verb.buffer = ir;
    const verbOut = ctx.createGain(); verbOut.gain.value = 0.5;
    verb.connect(verbOut).connect(master);
    verbSend = ctx.createGain(); verbSend.gain.value = 0.18; verbSend.connect(verb);
    return ctx;
  }
  function ready() {
    if (!init()) return false;
    if (ctx.state === 'suspended') ctx.resume();
    return true;
  }

  // ------------------------------------------------------------- primitives
  function noiseBuf(sec) {
    const b = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * sec)), ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return b;
  }
  let nb = null;
  function noise(t, dur, f, q, gain, type, out) {
    nb = nb || noiseBuf(1);
    const s = ctx.createBufferSource(); s.buffer = nb;
    const filt = ctx.createBiquadFilter(); filt.type = type || 'bandpass'; filt.frequency.value = f; filt.Q.value = q;
    const g = ctx.createGain();

    return g;
  }
  function partial(t, hz, dur, gain, type, out, attack) {
    const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = hz;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + (attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(out || sfxBus);
    o.start(t); o.stop(t + dur + 0.05);
    return g;
  }
  // FM bell / electric piano voice.
  function bell(t, hz, dur, gain, ratio, index, out) {
    const car = ctx.createOscillator(), mod = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
    car.frequency.value = hz; mod.frequency.value = hz * (ratio || 3.5);
    mg.gain.setValueAtTime(hz * (index || 2), t); mg.gain.exponentialRampToValueAtTime(hz * 0.05, t + dur * 0.6);
    mod.connect(mg).connect(car.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    g.connect(out || sfxBus);

  }

  // Material models for a piece meeting the board.
  const PACKS = {
    wood: { click: [2400, 1.2], body: [[190, 0.5, 0.09], [420, 0.25, 0.06], [930, 0.12, 0.035]], felt: 2600, gain: 0.9 },
    marble: { click: [4200, 2.5], body: [[520, 0.35, 0.18], [1210, 0.22, 0.14], [2650, 0.12, 0.1]], felt: 7000, gain: 0.75 },
    glass: { click: [6200, 4], body: [[1320, 0.3, 0.45], [2960, 0.2, 0.35], [4410, 0.12, 0.3]], felt: 9000, gain: 0.55 },
    soft: { click: [1200, 0.8], body: [[160, 0.4, 0.07], [320, 0.15, 0.05]], felt: 1100, gain: 0.5 },
  };
  function knock(t, weight, pitch) {
    const p = PACKS[pack] || PACKS.wood;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = p.felt; lp.connect(sfxBus);
    const send = ctx.createGain(); send.gain.value = 0.35; lp.connect(send).connect(verbSend);

    noise(t, 0.025 + weight * 0.02, p.click[0] * k, p.click[1], 0.55 * p.gain * weight, 'bandpass', lp);
    for (const [hz, g, d] of p.body) partial(t, hz * k, d * (0.8 + weight * 0.4), g * p.gain * weight, 'sine', lp, 0.0015);
  }

  // ----------------------------------------------------------------- effects
  const FX = {
    move(t) { knock(t, 0.9, 1); },
    capture(t) { knock(t, 0.6, 1.25); knock(t + 0.07, 1.25, 0.85); noise(t + 0.07, 0.12, 300, 0.7, 0.18, 'lowpass'); },
    castle(t) { knock(t, 0.8, 1); knock(t + 0.11, 0.8, 0.92); },
    check(t) { this.move(t); bell(t + 0.05, 1046.5, 0.9, 0.09, 3.5, 1.5); bell(t + 0.05, 1568, 0.7, 0.04, 2, 1); },
    promote(t) { this.move(t); [1046.5, 1318.5, 1568, 2093].forEach((hz, i) => bell(t + 0.06 + i * 0.07, hz, 0.8, 0.07, 3, 1.2)); },
    select(t) { noise(t, 0.018, 5200, 2, 0.12, 'bandpass'); },
    illegal(t) { partial(t, 110, 0.18, 0.25, 'sine'); noise(t, 0.05, 400, 1, 0.12, 'lowpass'); },
    tap(t) { noise(t, 0.012, 3800, 1.5, 0.15, 'bandpass'); partial(t, 1800, 0.03, 0.04, 'sine'); },
    open(t) {
      nb = nb || noiseBuf(1);
      const s = ctx.createBufferSource(); s.buffer = nb;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2400, t + 0.22);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.08, t + 0.08); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      s.connect(f).connect(g).connect(sfxBus); s.start(t, 0, 0.3);
    },
    tick(t) { noise(t, 0.01, 6000, 3, 0.1, 'bandpass'); },
    correct(t) { bell(t, 1318.5, 0.5, 0.08, 3, 1); bell(t + 0.08, 1975.5, 0.6, 0.07, 3, 1); },
    wrong(t) { bell(t, 392, 0.35, 0.07, 1.5, 1.5); bell(t + 0.1, 370, 0.4, 0.06, 1.5, 1.5); },
    win(t) { [523.25, 659.25, 783.99, 987.77, 1174.66].forEach((hz, i) => bell(t + i * 0.09, hz, 1.8, 0.09, 1, 1.1)); bell(t + 0.5, 261.63, 2.2, 0.08, 1, 0.8); },
    loss(t) { [440, 392, 349.23, 329.63].forEach((hz, i) => bell(t + i * 0.16, hz, 1.4, 0.07, 1, 0.9)); },
    draw(t) { bell(t, 523.25, 1.2, 0.08, 1, 1); bell(t + 0.18, 659.25, 1.3, 0.07, 1, 1); },
    levelUp(t) { [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98].forEach((hz, i) => bell(t + i * 0.06, hz, 1.2, 0.08, 3, 1.4)); },
    achievement(t) { bell(t, 1567.98, 1.1, 0.09, 3.5, 2); bell(t + 0.12, 2093, 1.2, 0.08, 3.5, 2); bell(t + 0.24, 2637, 1.4, 0.07, 3.5, 2); },
    coach(t) { bell(t, 880, 0.5, 0.05, 2, 1); bell(t + 0.07, 1318.5, 0.6, 0.045, 2, 1); },
    low(t) { partial(t, 1760, 0.06, 0.08, 'square'); },
  };

  function play(kind) {
    if (!sfxOn || !ready() || !FX[kind]) return;
    try { FX[kind].call(FX, ctx.currentTime + 0.005); } catch (e) { /* audio is optional */ }
  }

  // ---------------------------------------------------------- ambient score
  // Slow suspended chords on a warm pad with a sparse electric piano. A new
  // voicing every eight seconds; nothing repeats exactly.
  const CHORDS = [[48, 55, 62, 64, 71], [45, 52, 59, 60, 67], [41, 48, 55, 57, 64], [43, 50, 57, 59, 66], [40, 47, 54, 55, 62], [41, 48, 53, 57, 64]];
  const SCALE = [60, 62, 64, 67, 69, 72, 74, 76, 79, 81];
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  function startMusic() {
    if (music || !ready()) return;
    const out = ctx.createGain(); out.gain.value = 1; out.connect(musicBus);
    const wet = ctx.createGain(); wet.gain.value = 1.6; out.connect(wet).connect(verbSend);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.4; lp.connect(out);
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = 0.05; lfoG.gain.value = 350; lfo.connect(lfoG).connect(lp.frequency); lfo.start();
    music = { out, lp, lfo, timer: 0, step: 0 };
    musicBus.gain.cancelScheduledValues(ctx.currentTime);
    musicBus.gain.setTargetAtTime(musicVol * 0.5, ctx.currentTime, 1.5);
    const chord = () => {
      if (!music) return;
      const t = ctx.currentTime + 0.05;
      const c = CHORDS[music.step % CHORDS.length];
      music.step += 1 + (Math.random() < 0.3 ? 1 : 0);
      for (const n of c) {
        for (const det of [-6, 6]) {
          const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = midi(n); o.detune.value = det + (Math.random() - 0.5) * 4;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.018, t + 2.5); g.gain.setValueAtTime(0.018, t + 6.5); g.gain.exponentialRampToValueAtTime(0.0001, t + 10);
          o.connect(g).connect(music.lp); o.start(t); o.stop(t + 10.2);
        }
      }
      // Sparse melody on the electric piano.
      const notes = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < notes; i++) {
        const when = t + 1 + Math.random() * 6;
        bell(when, midi(SCALE[Math.floor(Math.random() * SCALE.length)]), 3, 0.05 + Math.random() * 0.03, 1, 0.9, out);
      }
      music.timer = setTimeout(chord, 8000);
    };
    chord();
  }
  function stopMusic() {
    if (!music) return;
    const m = music; music = null;
    clearTimeout(m.timer);
    if (ctx) {
      musicBus.gain.setTargetAtTime(0, ctx.currentTime, 0.6);
      setTimeout(() => { try { m.lfo.stop(); m.out.disconnect(); } catch (e) { /* already stopped */ } }, 3000);
    }

  // Narration through the device's speech engine (no network, no downloads).
  let voice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;

    return vs.find((v) => /en-(IN|GB)/i.test(v.lang) && /female|natural|neural|samantha|serena|veena/i.test(v.name)) || vs.find((v) => /^en/i.test(v.lang)) || null;

  return {
    play,
    setPack(p) { if (PACKS[p]) pack = p; },
    setSfx(on, vol) { sfxOn = on; if (vol !== undefined) sfxVol = vol; if (sfxBus) sfxBus.gain.value = sfxVol; },
    setMusic(on, vol) {
      musicOn = on; if (vol !== undefined) musicVol = vol;
      if (!ctx) return;
      if (on) { if (music) musicBus.gain.setTargetAtTime(musicVol * 0.5, ctx.currentTime, 0.4); else startMusic(); } else stopMusic();
    },
    // Browsers only allow sound after a user gesture; call this from one.
    unlock() { if (ready() && musicOn && !music) startMusic(); },
    say, hush,
    get musicOn() { return musicOn; },
  };
}

// ---- net.js ----
// Online client: connects to the Chacklate game server over WebSocket. The server is the referee
// (move legality, clocks, results, ratings); this file only relays and draws the account panel.
// When no server is reachable everything else in the app keeps working offline.
(function () {
  'use strict';
  const A = () => window.ChacklateApp;
  let sock = null, ready = false, retry = 0, retryTimer = null, me = null, ratings = null, seekingModal = null, friendModal = null, progressTimer = null;

  function base() {
    const s = A() && A().state.settings.server;
    if (s) return s.replace(/\/+$/, '').replace(/^ws/, 'http');
    if (location.protocol === 'http:' || location.protocol === 'https:') return location.origin;
    return '';
  }
  const wsUrl = () => base().replace(/^http/, 'ws') + '/ws';

  function connect() {
    clearTimeout(retryTimer);
    if (sock) { sock.onclose = null; try { sock.close(); } catch (e) { /* already closed */ } sock = null; }
    ready = false;
    if (!base() || typeof WebSocket === 'undefined') return;
    try { sock = new WebSocket(wsUrl()); } catch (e) { return schedule(); }
    sock.onopen = () => { retry = 0; sock.send(JSON.stringify({ type: 'hello', token: account().token || '' })); };
    sock.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onMessage(m); };
    sock.onclose = () => {
      const was = ready; ready = false; sock = null;
      if (was && A()) { A().toast('Reconnecting to the game server…'); A().onlineStatus({ offline: true }); }
      schedule();
    };
  }
  function schedule() { retryTimer = setTimeout(connect, Math.min(30000, 1000 * Math.pow(2, retry++))); }

  function account() { const st = A() && A().state; return (st && st.account) || {}; }
  function setAccount(a) { const st = A().state; st.account = Object.assign({}, st.account || {}, a); A().save(); }

  function send(m) { if (sock && ready) sock.send(JSON.stringify(m)); }

  function onMessage(m) {
    const app = A();
    if (!app) return;
    switch (m.type) {
      case 'welcome': {
        ready = true; me = m.user; ratings = m.ratings;
        setAccount({ token: m.token, name: me.name, guest: me.guest, id: me.id });
        // Adopt the server copy of progress when it is further along (a second device, a cleared browser).
        if (m.progress && m.progress.xp > app.state.progress.xp) { app.state.progress = app.PG.migrate(m.progress); app.save(); if (app.state.screen !== 'game') app.go(app.state.screen); }
        else syncProgress();
        if (m.entitlements) app.setEntitlements(m.entitlements);
        refreshPanel();
        if (['home', 'store', 'season'].includes(app.state.screen)) app.go(app.state.screen);
        if (app.state.game && app.state.game.kind === 'online') send({ type: 'sync' });
        return;
      }
      case 'seeking': return showSeeking(m.tc);
      case 'idle': closeSeeking(); return;
      case 'friend-code': return showCode(m.code, m.tc);
      case 'start':
        closeSeeking();
        if (friendModal) { friendModal.close(); friendModal = null; }
        app.startOnline({ id: m.id, color: m.color, tc: m.tc, opponent: m.opponent, moves: m.moves, clock: m.clock, rating: m.rating, rated: m.rated });
        if (m.away) app.onlineStatus({ opponentAway: true });
        return;
      case 'move': return app.onlineMove(m.uci, m.clock);
      case 'ack': return app.onlineStatus({ clock: Object.assign({}, m.clock, { at: performance.now() }) });
      case 'sync': return app.onlineSync(m.moves, m.clock);
      case 'status': return app.onlineStatus({ opponentAway: m.opponentAway, offline: false });
      case 'draw-offer': return app.drawOffered();
      case 'end':
        if (m.rating) { const g = app.state.game; const pool = poolFor(g && g.online ? g.online.tc : '5+3'); if (ratings && ratings[pool]) { ratings[pool].rating = m.rating.after; ratings[pool].games++; } }
        return app.onlineEnd(m.result, m.reason, m.rating);
      case 'reported': return app.toast('Thanks. A moderator will review the game.');
      case 'banned':
        setAccount({ token: '' });
        app.toast('This account is suspended: ' + m.reason, 'bad');
        return;
      case 'error': return app.toast(m.message, 'bad');
    }
  }

  function poolFor(tc) { const [mm, s] = String(tc).split('+').map(Number); const est = mm * 60 + 40 * s; return est < 180 ? 'bullet' : est < 480 ? 'blitz' : 'rapid'; }

  function showSeeking(tc) {
    const app = A();
    if (seekingModal) return;
    const started = Date.now();
    seekingModal = app.modal('<div class="seek-orb" aria-hidden="true"><i></i><i></i><i></i></div><h2 style="text-align:center">Finding an opponent</h2>' +
      '<p class="sub" style="text-align:center">' + app.esc(tc) + ' · rated · <span id="sk-t">0:00</span></p>' +
      '<div class="row" style="justify-content:center"><button class="btn" id="sk-ai">Play the computer instead</button><button class="btn" data-close>Cancel</button></div>',
    { sticky: true, onClose() { clearInterval(seekingModal && seekingModal.timer); if (seekingModal && !seekingModal.matched) send({ type: 'cancel' }); seekingModal = null; } });
    seekingModal.timer = setInterval(() => {
      const s = Math.floor((Date.now() - started) / 1000), el = seekingModal && seekingModal.querySelector('#sk-t');
      if (el) el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    }, 1000);
    seekingModal.querySelector('#sk-ai').onclick = () => { seekingModal.close(); app.quickPlayOffline(); };
  }
  function closeSeeking() { if (seekingModal) { seekingModal.matched = true; seekingModal.close(); } }

  function showCode(code, tc) {
    const app = A();

  function applyShift() {
    if (!current) return;
    const portrait = innerWidth < 760 && innerHeight > innerWidth;
    if (portrait) return view.setShift(0, current.shiftY == null ? 0.26 : current.shiftY, 1);
    if (innerWidth <= 980) return view.setShift(0, 0, 1);
    const right = document.querySelector('#screens .side, #screens .lesson');
    const left = document.querySelector('#screens .sheet, #screens .home');
    if (right) {
      const frac = (innerWidth - right.getBoundingClientRect().left) / innerWidth;
      return view.setShift(-frac, 0.03, 1 + frac * 0.5);
    }
    if (left) return view.setShift(Math.min(0.45, left.getBoundingClientRect().right / innerWidth * 0.85), 0, 1);

    startGame({ mode: 'ai', color: 'random', level: lv, tc: 'none', fen: '', personal: true });
  }

  // ---------------------------------------------------------------- game
  // One controller for computer, pass-and-play and online games.
  function parseTc(tc) {
    if (!tc || tc === 'none') return null;
    const [m, s] = tc.split('+').map(Number);
    return { w: m * 60000, b: m * 60000, inc: s * 1000, since: 0 };
  }
  function startGame(setup, restore) {
    state.setup = Object.assign({}, setup);
    const kind = setup.mode;
    let g;
    try { g = new E.Game(setup.fen || E.START_FEN); } catch (e) { g = new E.Game(); }
    const human = restore && restore.human ? restore.human : setup.color === 'black' ? BLACK : setup.color === 'random' ? (Math.random() < 0.5 ? WHITE : BLACK) : WHITE;
    const game = { kind, setup: state.setup, g, human, clock: parseTc(setup.tc), selected: -1, hint: null, hintStep: 0, busy: false, thinking: false, request: 0,
      viewSide: kind === 'local' ? 'white' : human === WHITE ? 'white' : 'black', coachMsg: null, evals: {}, threat: null, resultShown: false, review: null,
      online: setup.online || null, takebacks: 0, drawOffered: false };
    if (restore) {
      for (const u of restore.moves || []) if (!g.playText(u)) break;
      if (restore.clock && game.clock) Object.assign(game.clock, restore.clock, { since: 0 });
      if (kind === 'local' && state.settings.turnBoard) game.viewSide = g.pos.side === WHITE ? 'white' : 'black';
    }
    state.game = game;
    go('game');
    view.setView(game.viewSide, state.settings.view, true);
    if (!restore || !restore.moves || !restore.moves.length) view.intro();
    save();
    if (!g.outcome) maybeComputer();
    preAnalyse();
  }
  function resumeSaved() {
    const s = saved.game;
    saved.game = null;
    startGame(Object.assign({}, s.setup || state.setup, { fen: s.start === E.START_FEN ? '' : s.start }), { moves: s.moves, human: s.human, clock: s.clock });
  }

  SCREENS.game = function () {
    const G = state.game;
    view.setAttract(false);
    const ai = G.kind === 'ai', online = G.kind === 'online';
    mount(
      '<div class="topbar"><button class="btn glass small" id="g-home">' + icon('back') + '<span>Home</span></button><div class="pill gold" id="g-mode"></div><div class="spacer"></div>' +
      '<button class="btn glass icon" id="g-settings" title="Settings" aria-label="Settings">' + icon('gear') + '</button></div>' +
      '<div class="status-chip glass" id="g-chip" role="status"></div>' +
      '<div class="player-card glass top" id="p-top"></div><div class="player-card glass bottom" id="p-bottom"></div>' +
      '<div class="evalbar" id="evalbar" hidden><i id="evalfill" style="height:50%"></i></div>' +
      '<aside class="side glass" id="side"><header><b id="side-title">Moves</b><button class="btn small ghost" id="g-copy" title="Copy PGN">PGN</button></header>' +
      '<div id="coach-slot"></div><div class="moves-wrap" id="moves-wrap"><ol class="moves" id="moves" aria-label="Moves played"></ol></div>' +
      '<form id="move-form" style="display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)" autocomplete="off"><label class="sr" for="move-input">Type a move</label><input id="move-input" class="text-in" placeholder="Type a move: e4, Nf3, O-O" spellcheck="false" autocapitalize="off" style="padding:8px 10px"><button class="btn small">Play</button></form></aside>' +
      '<div class="actionbar glass" id="actionbar">' +
      (online ? '' : '<button class="btn" id="g-undo">' + icon('undo') + '<span class="lbl">Undo</span></button>') +
      (online ? '' : '<button class="btn" id="g-hint">' + icon('hint') + '<span class="lbl">Hint</span></button>') +
      (online ? '' : '<button class="btn" id="g-threat">' + icon('eye') + '<span class="lbl">Threat</span></button>') +
      '<span class="sep"></span>' +
      '<button class="btn" id="g-flip">' + icon('flip') + '<span class="lbl">Flip</span></button>' +
