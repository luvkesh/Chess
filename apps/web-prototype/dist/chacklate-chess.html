<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chacklate Chess</title>
<meta name="description" content="Premium 3D chess with eight AI personalities, a coach that explains every move, lessons, puzzles and online play.">
<meta name="theme-color" content="#120c0a">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chacklate">
<style>
/* One committed look: a dark chocolatier's atelier. The 3D room fills the
   window; every screen floats over it as frosted glass. */
:root {
  color-scheme: dark;
  --bg: #0f0a08; --glass: rgba(26, 17, 13, 0.72); --glass-2: rgba(36, 24, 19, 0.82); --solid: #1a120f; --raise: #251a15; --sunk: #0d0907;
  --line: rgba(255, 228, 200, 0.12); --line-2: rgba(255, 228, 200, 0.22);
  --ink: #f6ece2; --muted: #c2ad9e; --faint: #8d786b;
  --ruby: #d2466f; --ruby-2: #e8678e; --ruby-ink: #ffdbe5; --gold: #e3b25a; --gold-2: #f3d08a; --teal: #3fe0c8; --ok: #7fd6a4; --danger: #ff7a6e;
  --display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --r: 16px; --shadow: 0 24px 70px rgba(0, 0, 0, 0.55), 0 2px 0 rgba(255, 235, 210, 0.04) inset;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Stage, film grain and vignette */
#stage { position: fixed; inset: 0; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.06; mix-blend-mode: overlay; background-size: 180px; }
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }
.nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); z-index: 2; }

/* Shared pieces */
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: rgba(255, 235, 215, 0.05); border-radius: 12px; padding: 10px 14px; font-size: 14px; font-weight: 550; letter-spacing: 0.01em; transition: background .2s, border-color .2s, transform .15s var(--ease); white-space: nowrap; }
.btn:hover:not(:disabled) { background: rgba(255, 235, 215, 0.1); border-color: rgba(255, 228, 200, 0.35); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn.primary { background: linear-gradient(180deg, #e0567d, #b8325a); border-color: #e8678e; color: #fff; box-shadow: 0 8px 24px rgba(210, 70, 111, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25); }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ea6a8e, #c43a63); }
.btn.gold { background: linear-gradient(180deg, #f3d08a, #c9963e); border-color: #f3d08a; color: #2a1a0a; box-shadow: 0 8px 24px rgba(227, 178, 90, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: rgba(255, 235, 215, 0.07); }
.btn.small { padding: 7px 10px; font-size: 13px; border-radius: 10px; }
.btn.icon { padding: 9px; width: 40px; height: 40px; }
.btn.warn { border-color: var(--danger); color: #ffd6d1; }
.ico { width: 18px; height: 18px; flex: none; display: inline-block; vertical-align: -3px; }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }
.h-display { font-family: var(--display); font-weight: 400; letter-spacing: 0.005em; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; background: rgba(255, 235, 215, 0.07); border: 1px solid var(--line); color: var(--muted); }
.pill.gold { color: var(--gold-2); border-color: rgba(227, 178, 90, 0.35); background: rgba(227, 178, 90, 0.1); }
.pill.ruby { color: var(--ruby-ink); border-color: rgba(210, 70, 111, 0.45); background: rgba(210, 70, 111, 0.14); }
.pill.lock { color: var(--faint); }
.bar { height: 6px; border-radius: 999px; background: rgba(255, 235, 215, 0.09); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--gold), var(--gold-2)); transition: width .8s var(--ease); }
.avatar { position: relative; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; color: #fff; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 6px 16px rgba(0,0,0,.4); }
.avatar.ringed::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; padding: 3px; background: var(--ring); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.avatar.sm { width: 34px; height: 34px; font-size: 18px; }
.avatar.lg { width: 76px; height: 76px; font-size: 42px; }

/* Screens */
.screen { position: fixed; inset: 0; z-index: 5; pointer-events: none; }
.screen > * { pointer-events: auto; }
.screen.enter { animation: screenIn .45s var(--ease) both; }
@keyframes screenIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Top bar on every screen */
.topbar { position: absolute; top: max(14px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; pointer-events: none; z-index: 6; }
.topbar > * { pointer-events: auto; }
.topbar .spacer { flex: 1; pointer-events: none; }
.me-pill { display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 999px; }
.me-pill .lvl { font-size: 12px; color: var(--muted); }
.me-pill .lvl b { color: var(--gold-2); font-weight: 650; }
.me-pill .bar { width: 90px; margin-top: 4px; height: 4px; }
.streak { font-weight: 650; color: var(--gold-2); }

/* Home */
.home { position: absolute; left: max(28px, env(safe-area-inset-left, 0px)); top: 92px; bottom: 96px; width: min(470px, calc(100% - 56px)); display: flex; flex-direction: column; gap: 16px; overflow: auto; padding-bottom: 8px; scrollbar-width: none; }
.wordmark { font-family: var(--display); font-size: 56px; line-height: 0.95; letter-spacing: -0.01em; margin: 0; background: linear-gradient(180deg, #fff6ea, #e9c99a 70%, #c99a5a); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: 0 10px 40px rgba(227, 178, 90, 0.15); }
.wordmark small { display: block; font-size: 17px; letter-spacing: 0.5em; text-transform: uppercase; margin-top: 8px; color: var(--gold); -webkit-text-fill-color: var(--gold); font-family: var(--body); font-weight: 600; }
.tagline { color: var(--muted); margin: 0; max-width: 36ch; }
.actions { display: grid; gap: 10px; }
.action { position: relative; display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px; text-align: left; padding: 16px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2); box-shadow: var(--shadow); transition: transform .25s var(--ease), border-color .25s, background .25s; overflow: hidden; }
.action::before { content: ""; position: absolute; inset: 0; background: radial-gradient(400px 120px at 0% 0%, rgba(227, 178, 90, 0.12), transparent 60%); opacity: 0; transition: opacity .3s; }
.action:hover { transform: translateY(-2px); border-color: rgba(227, 178, 90, 0.4); }
.action:hover::before { opacity: 1; }
.action .glyph { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 28px; background: linear-gradient(145deg, rgba(255, 235, 215, 0.12), rgba(255, 235, 215, 0.03)); border: 1px solid var(--line); }
.action.hero .glyph { background: linear-gradient(145deg, #e0567d, #7a1630); border-color: #e8678e; color: #fff; }
.action b { display: block; font-size: 17px; font-weight: 650; }
.action span { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.action .go { color: var(--faint); font-size: 22px; }
.today { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mini { padding: 12px 14px; border-radius: 14px; }
.mini .eyebrow { font-size: 10.5px; }
.mini b { display: block; font-size: 22px; font-family: var(--display); font-weight: 400; margin-top: 2px; }

/* Bottom navigation */
.nav { position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 999px; z-index: 6; }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 76px; padding: 8px 12px; border: 0; background: transparent; border-radius: 999px; color: var(--muted); font-size: 11.5px; font-weight: 600; transition: background .2s, color .2s; }
.nav button .ico { width: 20px; height: 20px; }
.nav button[aria-current="page"] { background: rgba(255, 235, 215, 0.1); color: var(--ink); }
.nav button:hover { color: var(--ink); }

/* Panel screens (Learn, Improve, Collection, Profile) */
.sheet { position: absolute; top: 76px; bottom: 96px; left: max(20px, env(safe-area-inset-left, 0px)); width: min(620px, calc(100% - 40px)); display: flex; flex-direction: column; overflow: hidden; }
.sheet > header { padding: 22px 24px 12px; }
.sheet > header h2 { margin: 0; font: 400 34px/1.05 var(--display); }
.sheet > header p { margin: 6px 0 0; color: var(--muted); }
.sheet .body { flex: 1; overflow: auto; padding: 4px 24px 24px; scrollbar-width: thin; scrollbar-color: rgba(255,235,215,.2) transparent; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 0 24px 12px; scrollbar-width: none; }
.tabs button { flex: none; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; }
.tabs button[aria-selected="true"] { background: rgba(255, 235, 215, 0.1); color: var(--ink); border-color: var(--line-2); }

/* Journey map */
.chapter { margin: 10px 0 26px; }
.chapter h3 { margin: 0 0 4px; font: 400 22px/1.2 var(--display); display: flex; align-items: center; gap: 10px; }
.chapter .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
.path { position: relative; display: grid; gap: 10px; padding-left: 26px; }
.path::before { content: ""; position: absolute; left: 11px; top: 14px; bottom: 14px; width: 2px; background: linear-gradient(var(--gold), rgba(227, 178, 90, 0.1)); border-radius: 2px; }
.node { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 235, 215, 0.04); transition: border-color .2s, background .2s, transform .2s var(--ease); }
.node:hover:not(:disabled) { border-color: rgba(227, 178, 90, 0.45); background: rgba(255, 235, 215, 0.07); transform: translateX(2px); }
.node::before { content: ""; position: absolute; left: -21px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--sunk); border: 2px solid var(--gold); }
.node.done::before { background: var(--gold); box-shadow: 0 0 12px rgba(227, 178, 90, 0.6); }
.node.next { border-color: rgba(210, 70, 111, 0.55); background: rgba(210, 70, 111, 0.08); }
.node.next::before { border-color: var(--ruby); background: var(--ruby); box-shadow: 0 0 14px rgba(210, 70, 111, 0.8); }
.node:disabled { opacity: 0.55; cursor: default; }
.node b { display: block; font-weight: 600; }
.node small { color: var(--muted); }
.stars { color: var(--gold); letter-spacing: 2px; font-size: 14px; }
.stars .off { color: rgba(255, 235, 215, 0.18); }

/* Cards grid */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.card-btn { text-align: left; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255, 235, 215, 0.04); display: flex; flex-direction: column; gap: 6px; min-height: 120px; transition: border-color .2s, transform .2s var(--ease), background .2s; }
.card-btn:hover:not(:disabled) { border-color: rgba(227, 178, 90, 0.45); transform: translateY(-2px); background: rgba(255, 235, 215, 0.07); }
.card-btn .big { font-size: 28px; }
.card-btn b { font-size: 16px; }
.card-btn small { color: var(--muted); }
.card-btn.feature { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 16px; background: linear-gradient(135deg, rgba(210, 70, 111, 0.16), rgba(227, 178, 90, 0.08)); border-color: rgba(227, 178, 90, 0.3); }
.card-btn.feature .big { font-size: 40px; }

/* Collection */
.items { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item { position: relative; text-align: left; padding: 10px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 235, 215, 0.04); display: flex; flex-direction: column; gap: 8px; transition: border-color .2s, transform .2s var(--ease); }
.item:hover { border-color: rgba(227, 178, 90, 0.45); transform: translateY(-2px); }
.item.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 10px 30px rgba(227, 178, 90, 0.18); }
.item .sw { height: 74px; border-radius: 10px; overflow: hidden; display: grid; place-items: center; font-size: 30px; }
.item b { font-size: 13.5px; font-weight: 600; line-height: 1.25; }
.item .rar { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700; }
.rar.common { color: #b9a497; } .rar.rare { color: #7fc4ff; } .rar.epic { color: #c79bff; } .rar.legendary { color: var(--gold-2); }
.item.locked .sw { filter: grayscale(0.7) brightness(0.55); }
.item .lockline { font-size: 11.5px; color: var(--faint); }
.item .tag { position: absolute; top: 8px; right: 8px; }

/* Profile */
.hero-card { display: flex; gap: 16px; align-items: center; padding: 16px; border-radius: 16px; background: rgba(255, 235, 215, 0.05); border: 1px solid var(--line); margin-bottom: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 12px 0 18px; }
.stat { padding: 12px; border-radius: 12px; background: rgba(255, 235, 215, 0.04); border: 1px solid var(--line); }
.stat b { display: block; font: 400 24px/1.1 var(--display); }
.stat small { color: var(--muted); font-size: 12px; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.badge { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 235, 215, 0.03); }
.badge i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-style: normal; font-size: 18px; background: rgba(255, 235, 215, 0.06); flex: none; }
.badge.got i { background: linear-gradient(145deg, #f3d08a, #b8862b); color: #2a1a0a; box-shadow: 0 0 16px rgba(227, 178, 90, 0.35); }
.badge b { display: block; font-size: 13px; }
.badge small { color: var(--muted); font-size: 11.5px; line-height: 1.3; display: block; }
.badge:not(.got) { opacity: 0.6; }
.section-title { font: 400 20px/1.2 var(--display); margin: 18px 0 10px; }
.list { display: grid; gap: 6px; }
.row-item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 235, 215, 0.03); text-align: left; }
.row-item:hover { border-color: var(--line-2); }
.res { font: 700 11px/1 var(--mono); padding: 5px 7px; border-radius: 6px; letter-spacing: .06em; }
.res.win { background: rgba(127, 214, 164, 0.16); color: var(--ok); } .res.loss { background: rgba(255, 122, 110, 0.14); color: var(--danger); } .res.draw { background: rgba(227, 178, 90, 0.14); color: var(--gold); }
.field { margin: 0 0 14px; }
.field > label, .field > .label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.text-in { width: 100%; background: var(--sunk); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; }
.text-in:focus { border-color: var(--gold); outline: none; }
.err { color: var(--danger); font-size: 13px; min-height: 1.2em; margin: 6px 0 0; }

/* Game HUD */
.player-card { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: 16px; min-width: 240px; max-width: min(360px, calc(100% - 32px)); transition: border-color .3s, box-shadow .3s; z-index: 6; }
.player-card.top { top: 70px; }
.player-card.bottom { bottom: 84px; }
.player-card.to-move { border-color: rgba(227, 178, 90, 0.55); box-shadow: var(--shadow), 0 0 0 1px rgba(227, 178, 90, 0.25), 0 0 30px rgba(227, 178, 90, 0.12); }
.player-card .who { flex: 1; min-width: 0; }
.player-card .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.player-card .sub { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; white-space: nowrap; overflow: hidden; }
.player-card .caps { letter-spacing: -0.12em; font-size: 15px; color: var(--muted); }
.player-card .adv { font: 600 11px/1 var(--mono); color: var(--ok); margin-left: 4px; letter-spacing: 0; }
.clock { font: 650 22px/1 var(--mono); font-variant-numeric: tabular-nums; padding: 8px 10px; border-radius: 10px; min-width: 4.4em; text-align: center; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.clock.running { color: #10140f; background: linear-gradient(180deg, #c6f19a, #8fd862); border-color: #b6ea84; box-shadow: 0 0 20px rgba(159, 232, 112, 0.35); }
.clock.low { color: #fff; background: linear-gradient(180deg, #ff7a6e, #d93c3c); border-color: #ff9a8e; animation: lowpulse 1s ease-in-out infinite; }
@keyframes lowpulse { 50% { box-shadow: 0 0 26px rgba(255, 90, 80, 0.55); } }
.clock.skin-amber.running { background: linear-gradient(180deg, #ffcf8a, #f09a3a); border-color: #ffcf8a; color: #2a1406; }
.clock.skin-ruby.running { background: linear-gradient(180deg, #ff9ab4, #c43a63); border-color: #ff9ab4; color: #fff; }
.clock.skin-gold.running { background: linear-gradient(180deg, #fff1cf, #e3b25a); border-color: #fff1cf; color: #2a1a0a; }
.clock.skin-ice.running { background: linear-gradient(180deg, #e6f8ff, #8fd3ff); border-color: #e6f8ff; color: #06121a; }
.status-chip { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 6; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.status-chip.thinking::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); animation: pulse 1s ease-in-out infinite; }
.status-chip.check { border-color: rgba(255, 90, 80, 0.6); color: #ffd6d1; }
@keyframes pulse { 50% { opacity: 0.25; transform: scale(0.8); } }
.side { position: absolute; top: 70px; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 84px; width: 330px; display: flex; flex-direction: column; overflow: hidden; z-index: 6; }
.side header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.side header b { font: 400 18px/1.2 var(--display); flex: 1; }
.moves-wrap { flex: 1; overflow: auto; padding: 6px 0; min-height: 60px; }
.moves { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 2.8em 1fr 1fr; font: 14px/1.75 var(--mono); }
.moves li { display: contents; }
.moves .n { color: var(--faint); text-align: right; padding-right: 10px; }
.moves .m { padding: 0 8px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
.moves .m:hover { background: rgba(255, 235, 215, 0.06); }
.moves .m.cur { background: rgba(227, 178, 90, 0.2); color: #fff3dc; }
.moves .empty { grid-column: 1 / -1; color: var(--faint); font-family: var(--body); font-size: 13px; padding: 4px 14px; }
.cls { font: 700 10px/1 var(--body); padding: 3px 5px; border-radius: 5px; letter-spacing: 0.02em; }
.cls.brilliant { background: #1fb5c9; color: #04252a; } .cls.best { background: #7fd6a4; color: #0b2a18; } .cls.excellent { background: #9ad58a; color: #13290d; }
